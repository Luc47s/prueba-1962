<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11161d">
<title>Cena con Movente · El último fallo · partida rápida</title>
<style>
:root{--fondo:#11161d;--panel:#1a212b;--borde:#2c3644;--texto:#ece6d8;--suave:#a7adb6;--oro:#d9a441;--hortensia:#8fa9dc;--papel:#f4ecd8;--tinta:#2a2118;--mal:#e3826f;--ok:#7cc79a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);background-image:radial-gradient(circle at 50% -20%,#22324a 0,transparent 60%);color:var(--texto);font:18px/1.5 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 56px}
.cab{text-align:center;border-bottom:1px solid var(--borde);padding:6px 0 10px;margin-bottom:12px}
.hotel{margin:0;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
.marca{margin:2px 0 0;font-size:.85rem;color:var(--suave);font-style:italic}.marca span{font-style:normal}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;line-height:1.2}
.titulo{font-size:1.75rem;margin:.3em 0 .2em}.sub{color:var(--suave);margin-top:0}
.nombre{font-size:1.9rem;margin:.2em 0 .4em;color:var(--oro)}
h2{font-size:1.25rem;color:var(--oro);margin:.2em 0 .5em}h3{font-size:1rem;margin:1em 0 .3em;color:var(--hortensia);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px 16px;margin:12px 0}
.carta{background:var(--papel);color:var(--tinta);border-radius:6px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 0 #b9a77f,0 6px 18px rgba(0,0,0,.35);border:1px solid #d8c9a3}
.carta h3{color:#6b4f1d}.carta summary{color:#6b4f1d}
.carta.nueva{border-left:6px solid var(--oro)}
.etq{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin:0 0 6px}
.carta .etq{color:#8a6420}
summary{cursor:pointer;font-weight:bold;color:var(--oro);padding:2px 0;list-style-position:outside}
details .cuerpo{margin-top:8px}
button{display:block;width:100%;font:inherit;font-weight:bold;margin:10px 0;padding:14px;border-radius:12px;border:0;background:var(--oro);color:#1c1406;cursor:pointer;min-height:52px}
button.sec{background:transparent;color:var(--texto);border:1px solid var(--borde);font-weight:normal}
button.grande{font-size:1.15rem;background:var(--papel);color:var(--tinta)}
button.pequeno{min-height:40px;padding:8px;font-size:.9rem}
.numeros{display:flex;gap:8px;flex-wrap:wrap}.numeros button{flex:1;min-width:52px;font-size:1.3rem}
input[type=text]{width:100%;font:inherit;font-size:1.3rem;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#0c1015;color:var(--texto);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.codigo input{text-align:center;font-size:1.8rem;letter-spacing:.4em}
.error{color:var(--mal);min-height:1.3em;font-size:.95rem;margin-top:6px}
.nota{color:var(--suave);font-size:.88rem}
.carta .nota{color:#6d6250}
.como ol{padding-left:1.2em;margin:0}.como li{margin:.35em 0}
.chip{display:inline-block;background:#24324a;color:var(--hortensia);border:1px solid #34486a;border-radius:999px;padding:3px 12px;font-size:.85rem;letter-spacing:.05em;margin:4px 0}
.fila-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mesa{font-size:.75rem;color:var(--suave);letter-spacing:.08em;margin-left:auto}
.tapar-fijo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;margin:0;z-index:5;background:#0c1015;color:var(--oro);border:2px solid var(--oro);box-shadow:0 6px 20px rgba(0,0,0,.7);font-size:1.05rem;letter-spacing:.04em}
main{padding-bottom:96px}
.kit{margin-top:14px;border-top:1px dashed #cdbd95;padding-top:4px}.kit .decir{padding-left:1.1em}.kit .decir li{margin:.35em 0;font-style:italic}.preg b{display:inline-block;margin-bottom:2px}
.telon{position:fixed;inset:0;background:#0b0e12;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;z-index:10}.telon p{margin:.2em}
.presentacion{font-style:italic}
.horas{list-style:none;padding:0;margin:0}.horas li{padding:6px 0;border-bottom:1px dashed #cdbd95}.horas b{display:inline-block;min-width:3.4em;color:#6b4f1d}
.papel{margin-top:14px;padding:10px 12px;border-radius:6px;background:#e9dfc4;border:1px solid #cdbd95}
.papel-t{font-weight:bold;font-size:1.1rem;margin:0 0 4px}
/* El recuadro del culpable es idéntico al de los inocentes: que no se distinga de un vistazo. */
.regla{border-left:4px solid var(--oro);padding-left:10px;font-weight:bold}
.decl{padding-left:1.1em}.decl li{margin:.4em 0}
.cierre{color:var(--hortensia);font-style:italic}
.leer{border-left:4px solid var(--hortensia)}
.codigo-grande{text-align:center}.digitos{font-size:3.4rem;letter-spacing:.25em;margin:.1em 0;color:var(--oro);font-family:'Courier New',monospace;font-weight:bold}
.tiempo{color:var(--suave);font-size:.95rem;margin:0}
.pestanas{display:flex;gap:6px;margin:4px 0 8px}.pestanas button{margin:0;min-height:44px;background:transparent;color:var(--suave);border:1px solid var(--borde);font-weight:normal}
.pestanas button.activa{background:var(--panel);color:var(--oro);border-color:var(--oro);font-weight:bold}
.qr-bloque{text-align:center}.qr{background:#fff;border-radius:10px;padding:6px;max-width:300px;margin:8px auto}.qr svg{display:block;width:100%;height:auto}
.token{font-family:'Courier New',monospace;font-size:2rem;letter-spacing:.12em;color:var(--oro);margin:.2em 0;font-weight:bold}
.enlace{font-size:.8rem;letter-spacing:0;text-transform:none}
.cuaderno{width:100%;border-collapse:collapse;font-size:.85rem}.cuaderno th{text-align:left;color:var(--oro);font-weight:normal;padding:4px}
.cuaderno td{padding:6px 4px;border-top:1px solid var(--borde);vertical-align:top}.cuaderno small{display:block;color:var(--suave);font-size:.75rem}
.cuaderno tr.tachado td{opacity:.35;text-decoration:line-through}
.voto .grande{font-size:1.4rem;color:var(--oro);margin:.2em 0}
.revelacion .fue{font-size:1.8rem;color:var(--oro)}.ironia{font-style:italic;border-left:4px solid var(--hortensia);padding-left:10px}
.resultado{font-size:1.3rem;font-weight:bold}.resultado[data-resultado=acierto]{color:var(--ok)}.resultado[data-resultado=fallo]{color:var(--mal)}
.aviso{border-color:var(--oro)}
.regla-pie p{margin:18px 0 0;text-align:center}
.regla-inventar{font-weight:bold;color:var(--oro)}.guia .regla-inventar{margin-top:6px}
</style>
</head>

      decl.push({ tipo: 'CONF', ronda: aplazados.indexOf(L(c)) >= 0 ? 3 : 2, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, L(c), T).quien, sujeto: c, lugar: L(c), hora: T });

    for (const l of aplazados) decl.push({ tipo: 'PENDIENTE', ronda: 2, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, l, T).quien, lugar: l, hora: T });
    for (const c of reparto.slice().sort(orden)) {
      const l = L(c);
      if (personalEn(C, l, T) && parciales.indexOf(c) >= 0) decl.push({ tipo: 'PARCIAL', ronda: 3, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, l, T).quien, sujeto: c, lugar: l, hora: T });
      else if (documentoEn(C, l, T)) decl.push({ tipo: 'PARCIAL', ronda: 3, publica: true, fuente: 'npc', clase: 'documento', quien: documentoEn(C, l, T).quien, sujeto: c, lugar: l, hora: T });
    }
    decl.push({ tipo: 'PRUEBA', ronda: 3, publica: true, sena: K });
    // Datos privados de la ronda 3 (fase 2c):
    //  - cada dato es distinto (nunca dos sobre lo mismo) y cada uno viene de un testigo distinto;
    //  - al menos uno SEÑALA (un gesto verdadero del culpable o del cebo antes del crimen);
    //  - si hay otro inocente con la seña que la mesa no puede descartar en público, descartar al cebo
    //    exige cruzar dos móviles: el «puente» descarta al cebo y otro inocente descarta al puente.
    const datos = {}; I.forEach(w => { datos[w] = []; });
    const add = d => { decl.push(d); datos[d.fuente].push(d); return d; };
    const quitar = d => { decl.splice(decl.indexOf(d), 1); datos[d.fuente].splice(datos[d.fuente].indexOf(d), 1); };
    for (const w of I) {
      const l = L(w);
      if (!C.lugares[l].compartido) continue;
      const vio = I.filter(c => c !== w && L(c) === l), noVio = L(X) === l ? [X] : [];
      if (vio.length || noVio.length) add({ tipo: 'VISTA', ronda: 3, publica: false, fuente: w, lugar: l, hora: T, vio, noVio });
    }
    const usados = new Set();
    const testigoPara = y => (C.lugares[L(y)].testigos || []).find(t => !usados.has(t.quien)) || null;
    const relevable = y => !!testigoPara(y);
    const relevo = (w, y, tipo) => { const t = testigoPara(y); usados.add(t.quien); return add({ tipo: tipo || 'CONF', ronda: 3, publica: false, fuente: w, clase: 'relevo', quien: t.quien, duda: t.duda, sujeto: y, lugar: L(y), hora: T }); };
    const dicho = y => decl.some(d => !d.publica && d.tipo === 'CONF' && d.sujeto === y);
    const visto = y => decl.some(d => d.tipo === 'VISTA' && d.vio.indexOf(y) >= 0);
    const descartadoEnPublico = w => !tieneSena(C, w, K) || decl.some(d => d.publica && d.tipo === 'CONF' && d.sujeto === w);
    const libre = w => !datos[w].length;
    const mejorTestigo = excluir => I.filter(w => excluir.indexOf(w) < 0)
      .sort((a, b) => (datos[a].length - datos[b].length) || ((descartadoEnPublico(b) ? 1 : 0) - (descartadoEnPublico(a) ? 1 : 0)) || orden(a, b))[0];
    // Quién recibe el dato que SEÑALA: el culpable o el cebo, alternando según el reparto
    // (invertirSenala: segunda opción, si con la primera no se puede dar el dato a otro inocente)
    const parSenala = (reparto.reduce((s, c) => s + P(C, c).n, 0) % 2 === 0) !== !!invertirSenala;
    const sujetoSenala = !cebo || parSenala ? X : cebo;
    const senalar = w => add({ tipo: 'SENALA', ronda: 3, publica: false, fuente: w, sujeto: sujetoSenala, sena: K, hora: T });
    let cadena = false;
    // 1) Despejar al cebo con un dato privado (con cadena de dos móviles si se puede)
    if (cebo && !visto(cebo)) {
      if (!relevable(cebo)) { if (!forzar) return null; }
      else {
        const pubCand = candidatos(C, reparto, decl.filter(d => d.publica), 3, T);
        const puente = I.find(c => c !== cebo && pubCand.indexOf(c) >= 0 && libre(c) && !visto(c) && relevable(c));
        const w2 = puente && I.find(w => w !== puente && w !== cebo && libre(w) && descartadoEnPublico(w));
        if (puente && w2 && L(puente) !== L(cebo)) { relevo(puente, cebo); relevo(w2, puente); cadena = true; }
        else { const w = mejorTestigo([cebo]); if (!w) { if (!forzar) return null; } else relevo(w, cebo); }
      }
    }
    // 2) Ningún inocente sin dato: primero el que señala; después, datos nuevos (sin repetir sujeto)
    const c2 = candidatos(C, reparto, decl, 2, T);
    for (const w of I) {
      if (datos[w].length) continue;
      // (nunca al propio señalado: no puede «verse» a sí mismo)
      if (!decl.some(d => d.tipo === 'SENALA') && w !== sujetoSenala) { senalar(w); continue; }
      const ys = I.filter(y => y !== w && !dicho(y) && relevable(y)).sort((a, b) => ((c2.indexOf(b) >= 0 ? 1 : 0) - (c2.indexOf(a) >= 0 ? 1 : 0)) || orden(a, b));
      if (ys.length) relevo(w, ys[0]);
      else if (!decl.some(d => !d.publica && d.tipo === 'NOT' && d.sujeto === X) && relevable(X)) relevo(w, X, 'NOT');
      else if (!forzar) return null;
    }
    // 3) Que solo quede el culpable
    for (let paso = 0; paso < 12; paso++) {
      const quedan = candidatos(C, reparto, decl, 3, T).filter(h => h !== X);
      if (!quedan.length) break;
      const y = quedan.find(z => relevable(z) && !dicho(z));
      const w = y && mejorTestigo([y]);
      if (!y || !w) { if (!forzar) return null; break; }
      relevo(w, y);
    }
    // 4) Si nadie señala todavía, el dato de algún inocente que no haga falta se cambia por el que señala
    if (!decl.some(d => d.tipo === 'SENALA')) {
      for (const w of I) {
        if (datos[w].length !== 1 || w === sujetoSenala) continue;
        const d = datos[w][0];
        quitar(d);
        const sigue = candidatos(C, reparto, decl, 3, T);
        const pub = candidatos(C, reparto, decl.filter(z => z.publica), 3, T);
        if (sigue.length === 1 && sigue[0] === X && (!cebo || pub.indexOf(cebo) >= 0)) {
          if (d.clase === 'relevo') usados.delete(d.quien);
          senalar(w); break;
        }
        add(d);
      }
    }
    if (!forzar) {
      const r2 = candidatos(C, reparto, decl, 2, T), r3 = candidatos(C, reparto, decl, 3, T);
      const pub = candidatos(C, reparto, decl.filter(d => d.publica), 3, T);
      if (r2.length < 3 || (cebo && r2.indexOf(cebo) < 0)) return null;
      if (r3.length !== 1 || r3[0] !== X) return null;
      if (cebo && pub.indexOf(cebo) < 0) return null;
      if (I.some(w => !datos[w].length)) return null;
      if (!decl.some(d => d.tipo === 'SENALA')) return null;
    }
    decl.forEach((d, i) => { d.id = 'd' + (i + 1); });
    decl.cadena = cadena;
    return decl;
  }

  // Elige la prueba (entre las señas del culpable) y el cebo, y genera las pistas. Devuelve
  // { decl, prueba, pruebaIdx, cebo }.
  function generarDeclaraciones(C, reparto, X, v) {
    const T = v.hora;
    const I = reparto.filter(c => c !== X).sort(porN(C));
    const pref = c => { const l = lugarDe(C, c, T); return l === 'H' || l === 'J' ? 0 : l === 'V' ? 1 : 2; };
    const ops = pruebasDe(v);
    let mejor = null;
    for (let ip = 0; ip < ops.length; ip++) {
      const K = ops[ip].sena;
      const cebos = I.filter(c => tieneSena(C, c, K)).sort((a, b) => pref(a) - pref(b) || P(C, a).n - P(C, b).n);
      for (const cebo of cebos) {
        const decl = construirPistas(C, reparto, X, T, K, cebo, false) || construirPistas(C, reparto, X, T, K, cebo, false, true);
        if (!decl) continue;
        // Se prefiere la opción que da a cada inocente un solo dato privado (papeles de la misma longitud)
        const porTestigo = {};
        for (const d of decl) if (!d.publica) porTestigo[d.fuente] = (porTestigo[d.fuente] || 0) + (d.tipo === 'VISTA' ? (d.vio.length ? 1 : 0) + d.noVio.length : 1);
        const nota = Math.max(0, ...Object.values(porTestigo)) * 100 + (decl.cadena ? 0 : 50) + ip * 10 + pref(cebo);
        if (!mejor || nota < mejor.nota) mejor = { decl, prueba: K, pruebaIdx: ip, cebo, nota };
      }
    }
    if (mejor) { delete mejor.nota; return mejor; }
    return { decl: construirPistas(C, reparto, X, T, ops[0].sena, null, true), prueba: ops[0].sena, pruebaIdx: 0, cebo: null };
  }

  // ---------- Partida ----------
  function armarPartida(C, semilla, asientos, culpable, v) {
    const g = generarDeclaraciones(C, asientos, culpable, v);
    return {
      semilla, n: asientos.length, asientos, culpable, variante: v.id, hora: v.hora, prueba: g.prueba, pruebaIdx: g.pruebaIdx, cebo: g.cebo,
      codigos: codigos(semilla), declaraciones: g.decl,
    };
  }
  function crearPartida(C, semilla, n) {
    if (!(n >= 4 && n <= 8)) throw new Error('De 4 a 8 jugadores');
    const r = azar(mezcla(semilla, n, 0x4d43));
    const posibles = C.variantes.map(v => v.culpable);
    let asientos = null;
    for (let i = 0; i < 200; i++) {
      asientos = barajar(C.personajes.map(p => p.id), r).slice(0, n);
      if (asientos.some(id => posibles.indexOf(id) >= 0)) break;
    }
    const cand = asientos.filter(id => posibles.indexOf(id) >= 0);
    const culpable = cand[Math.floor(r() * cand.length)];
    const vs = C.variantes.filter(v => v.culpable === culpable);
    const v = vs[Math.floor(r() * vs.length)];
    return armarPartida(C, semilla, asientos, culpable, v);
  }
  const varianteDe = (C, partida) => C.variantes.find(v => v.id === partida.variante);
  const pruebaDe = (C, partida) => pruebasDe(varianteDe(C, partida))[partida.pruebaIdx || 0];

  // «Otra partida» con el mismo grupo (escaneando en el mismo orden). Recuerda TODA la sesión:
  //  - el culpable es otra persona (otro asiento) hasta que hayan sido culpables los n jugadores;
  //  - y otro personaje hasta que hayan salido todos los personajes que pueden ser culpables;
  //  - al empezar un ciclo nuevo, tampoco repite el culpable de la última partida;
  //  - si se puede, además cada uno recibe un personaje distinto del de la partida anterior.
  // Solo lo calcula el móvil del anfitrión, que guarda las semillas de la sesión; no muestra nada.
  function semillaSiguiente(C, historial, n) {
    const hist = (Array.isArray(historial) ? historial : [historial]).map(s => crearPartida(C, s, n));
    const ultimo = hist[hist.length - 1];
    const totalPj = C.variantes.map(v => v.culpable).filter((x, i, a) => a.indexOf(x) === i).length;
    let asientos = [], pjs = [];
    for (const p of hist) {
      if (asientos.length >= n) asientos = [];
      asientos.push(p.asientos.indexOf(p.culpable));
      if (pjs.length >= Math.min(totalPj, n)) pjs = [];
      pjs.push(p.culpable);
    }
    const prohibeA = asientos.length >= n ? [ultimo.asientos.indexOf(ultimo.culpable)] : asientos;
    const prohibeP = pjs.length >= Math.min(totalPj, n) ? [ultimo.culpable] : pjs;
    let nivel1 = null, nivel2 = null;
    for (let i = 1; i < 30000; i++) {
      const s = mezcla(ultimo.semilla, hist.length, i, 0x51) % MAX_SEMILLA;
      // Solo hace falta el reparto y el culpable: se calcula sin generar las pistas (más rápido)
      const p = repartoDe(C, s, n);
      if (prohibeA.indexOf(p.asientos.indexOf(p.culpable)) >= 0) continue;
      if (nivel2 === null) nivel2 = s;
      if (prohibeP.indexOf(p.culpable) >= 0) continue;
      if (nivel1 === null) nivel1 = s;
      if (p.asientos.every((id, k) => id !== ultimo.asientos[k])) return s;
    }
    return nivel1 !== null ? nivel1 : nivel2 !== null ? nivel2 : nuevaSemilla();
  }
  function repartoDe(C, semilla, n) {
    const r = azar(mezcla(semilla, n, 0x4d43));
    const posibles = C.variantes.map(v => v.culpable);
    let asientos = null;
    for (let i = 0; i < 200; i++) { asientos = barajar(C.personajes.map(p => p.id), r).slice(0, n); if (asientos.some(id => posibles.indexOf(id) >= 0)) break; }
    const cand = asientos.filter(id => posibles.indexOf(id) >= 0);
    return { asientos, culpable: cand[Math.floor(r() * cand.length)] };
  }

  // ---------- Textos ----------
  // Todas las pantallas privadas tienen la MISMA estructura para inocentes y culpable, ronda a ronda:
  //   situación (lo nuevo) + kit { decir: 2 frases para decir en voz alta, pregunta: {q, a}, jugada }.
  // tools/verificar-misterio-rapido.js comprueba que la longitud no difiere más de un 10 % en la misma ronda.
  const otroAsiento = (partida, asiento, k) => partida.asientos[(asiento - 1 + k) % partida.n];
  function elegir(partida, asiento, ids) {
    for (let k = 1; k <= partida.n; k++) { const x = otroAsiento(partida, asiento, k); if (ids.indexOf(x) >= 0) return x; }
    return null;
  }
  function ctx(C, partida, asiento, g) {
    const id = partida.asientos[asiento - 1];
    const p = P(C, id);
    const nombre = p.nombres[g] || p.nombres.M;
    const h = partida.hora;
    const t = s => genero(rellenar(s, { s: nombre, h }), g);
    const l = lugarDe(C, id, h);
    return {
      id, p, nombre, h, t, v: varianteDe(C, partida), culpable: id === partida.culpable, ap: x => P(C, x).apellido,
      lugar: l === 'H' ? C.lugares.H.tu : nombreLugar(C, l, h), lugarYo: l === 'H' ? C.lugares.H.yo : nombreLugar(C, l, h), codLugar: l,
      sena: C.senas[partida.prueba], c2: candidatos(C, partida.asientos, partida.declaraciones, 2, h),
    };
  }
  const comillas = s => '«' + s + '»';
  // Frase con la voz del personaje (si la tiene) o la común
  const vz = (C, p, k) => (p.voz && p.voz[k]) || C.textos[k];
  const conComa = q => q + (q.indexOf(',') >= 0 ? ',' : '');

  function tarjeta(C, partida, asiento, g) {
    const x = ctx(C, partida, asiento, g);
    const { p, t, v } = x;
    const kit = x.culpable
      ? { decir: v.kit.r1.decir.map(s => comillas(t(s))), pregunta: { q: t(v.kit.r1.q), a: comillas(t(v.kit.r1.a)) } }
      : { decir: p.decirR1.map(s => comillas(t(s))), pregunta: { q: t(p.preguntaR1.q), a: comillas(t(p.preguntaR1.a)) } };
    // Sin nombres: en la ronda 1 todavía no se han presentado
    kit.jugada = x.culpable ? rellenar(C.textos.r1JugadaCulpable, { h: x.h }) : (p.voz && p.voz.r1Jugada) || C.textos.r1JugadaInocente;
    return {
      id: x.id, nombre: x.nombre, apellido: p.apellido,
      presentacion: t(p.presentacion), secreto: t(p.secreto), relacion: t(p.relacion),
      coartada: C.momentos.map(h => ({ hora: h, texto: t(p.detalle[h]) })),
      senas: p.senas.map(s => C.senas[s].tuya),
      papel: x.culpable
        ? { culpable: true, titulo: C.textos.culpableTitulo, texto: [t(v.loQuePaso), t(v.version) + ' ' + t(C.textos.culpableCierre)] }
        : { culpable: false, titulo: C.textos.inocenteTitulo, texto: [t(p.tuTarde), t(C.textos.inocente)] },
      kit,
    };
  }

  function textoDeclaracion(C, d) {
    if (d.texto) return d.texto;
    if (d.tipo === 'PENDIENTE') return rellenar(fx(C, 'pendiente'), { quien: conComa(d.quien) });
    const s = P(C, d.sujeto).apellido;
    if (d.tipo === 'PARCIAL') return rellenar(d.clase === 'documento' ? C.lugares[d.lugar].documento.parcial : C.lugares[d.lugar].personal.parcial, { h: d.hora, s });
    if (d.clase === 'relevo') { const t = rellenar(d.tipo === 'NOT' ? C.textos.datoRelevoNo : C.textos.datoRelevoSi, { quien: conComa(d.quien), h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) }); return t.charAt(0).toUpperCase() + t.slice(1); }
    if (d.tipo === 'NOT') return rellenar(fx(C, 'declNo'), { quien: d.quien, h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) });
    return rellenar(fx(C, 'declSi'), { quien: d.quien, h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) });
  }

  // Declaraciones públicas de una ronda, agrupando las del personal («Ercole: vio a A y B en la terraza»).
  function declaracionesPublicas(C, partida, ronda) {
    const ds = partida.declaraciones.filter(d => d.publica && d.ronda === ronda && d.tipo !== 'PRUEBA');
    const out = [];
    const grupos = {};
    for (const d of ds) {
      if (d.clase === 'personal' && d.tipo === 'CONF') {
        const k = d.quien + '|' + d.lugar;
        if (!grupos[k]) { grupos[k] = { d, sujetos: [] }; out.push(grupos[k]); }
        grupos[k].sujetos.push(P(C, d.sujeto).apellido);
      } else out.push({ texto: textoDeclaracion(C, d) });
    }
    return out.map(x => (x.texto ? x.texto : rellenar(fx(C, 'declSi'), { quien: x.d.quien, h: x.d.hora, s: lista(x.sujetos, C), lugar: nombreLugar(C, x.d.lugar, x.d.hora) })));
  }

  function publico(C, partida, ronda) {
    const v = varianteDe(C, partida);
    const T = C.textos, h = partida.hora;
    if (ronda === 1) return { titulo: fx(C, 'tituloR1'), parrafos: T.r1Publico.slice(), regla: T.regla, instruccion: T.r1Instruccion, declaraciones: [] };
    if (ronda === 2) {
      const decl = declaracionesPublicas(C, partida, 2);
      for (const id of partida.asientos) { const l = C.lugares[lugarDe(C, id, h)]; if (l.notaR2 && l.documento && l.documento.horas.indexOf(h) >= 0 && decl.indexOf(l.notaR2) < 0) decl.push(l.notaR2); }
      return { titulo: fx(C, 'tituloR2'), parrafos: [v.textoHora], declaraciones: decl, cierre: rellenar(T.r2Cierre, { h }) };
    }
    if (ronda === 3) {
      const decl = declaracionesPublicas(C, partida, 3);
      return { titulo: fx(C, 'tituloR3'), parrafos: [pruebaDe(C, partida).texto], declaraciones: decl.length ? decl : [fx(C, 'nadieMas')], cierre: rellenar(T.r3Cierre, { h }) };
    }
    return { titulo: fx(C, 'tituloVoto'), parrafos: [T.voto], declaraciones: [] };
  }

  // El dato privado de un inocente, en una frase
  // corto = forma breve, para quien tiene más de un dato (así todos los papeles miden lo mismo)
  function fraseDato(C, partida, d, corto) {
    const ap = x => P(C, x).apellido, T = C.textos;
    if (d.tipo === 'VISTA') {
      const f = [];
      if (d.vio.length) f.push(rellenar(corto ? T.datoVioCorto : T.datoVio, { lista: lista(d.vio.map(ap), C) }));
      for (const x of d.noVio) f.push(rellenar(corto ? T.datoNoVioCorto : T.datoNoVio, { s: ap(x) }));
      return f.join(' ');
    }
    if (d.tipo === 'SENALA') return rellenar(corto ? T.datoSenalaCorto : T.datoSenala, { s: ap(d.sujeto), gesto: C.senas[d.sena].gesto });
    if (corto && d.clase === 'relevo') return rellenar(d.tipo === 'NOT' ? T.datoRelevoNoCorto : T.datoRelevoSiCorto, { quien: conComa(d.quien), s: ap(d.sujeto), lugar: nombreLugar(C, d.lugar, d.hora) });
    return textoDeclaracion(C, d);
  }

  function privado(C, partida, asiento, g, ronda) {
    const x = ctx(C, partida, asiento, g);
    const { p, t, v, h, ap } = x;
    const T = C.textos;
    const r = s => t(rellenar(s, { h, lugar: x.lugar, lugarYo: x.lugarYo }));
    if (ronda === 2) {
      const Z = otroAsiento(partida, asiento, 1);
      const situacion = [rellenar(fx(C, 'secretoDe'), { s: ap(Z), rumor: P(C, Z).rumor })];
      const Y = elegir(partida, asiento, x.c2.filter(z => z !== x.id));
      const q = r(T.r2Pregunta);
      if (x.culpable) {
        situacion.push(r(T.r2Culpable));
        return { situacion, kit: { decir: v.kit.r2.decir.map(s => comillas(r(s))), pregunta: { q, a: comillas(r(v.kit.r2.a)) }, jugada: rellenar(vz(C, p, 'r2Jugada'), { s: ap(Y), h }) } };
      }
      const conf = partida.declaraciones.find(d => d.tipo === 'CONF' && d.ronda === 2 && d.publica && d.sujeto === x.id);
      const pend = partida.declaraciones.find(d => d.tipo === 'PENDIENTE' && d.lugar === x.codLugar);
      const estado = conf ? rellenar(T.r2Confirmado, { quien: conf.quien }) : pend ? rellenar(T.r2Pendiente, { quien: pend.quien }) : T.r2SinTestigo;
      const resp = conf ? rellenar(vz(C, p, 'r2RespConfirmado'), { quien: conf.quien }) : pend ? rellenar(vz(C, p, 'r2RespPendiente'), { quien: pend.quien.split(',')[0] }) : vz(C, p, 'r2RespSinTestigo');
      situacion.push(r(T.r2Inocente) + ' ' + estado);

  'use strict';
  const M = MotorRapido, Q = QRCodigo;
  const C = M.desofuscar(DATOS);
  const app = document.getElementById('app');
  // Textos fijos de la interfaz, en el idioma del contenido (C.interfaz). U('clave', {variables})
  const U = (k, vars) => { const x = C.interfaz && C.interfaz[k]; if (typeof x !== 'string') throw new Error('Falta el texto de interfaz ' + k); return vars ? M.rellenar(x, vars) : x; };
  // Cada idioma guarda su progreso aparte (el español conserva la clave de siempre)
  const PREF = 'cenaMovente.rapido.v1:' + (C.idioma && C.idioma !== 'es' ? C.idioma + ':' : '');
  const leer = k => { try { return JSON.parse(localStorage.getItem(PREF + k)); } catch (e) { return null; } };
  const escribir = (k, v) => { try { localStorage.setItem(PREF + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: sigue en memoria */ } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const el = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };
  const AP = id => C.personajes.find(p => p.id === id).apellido;
  const cache = {};
  const partidaDe = (semilla, n) => cache[semilla + ':' + n] || (cache[semilla + ':' + n] = M.crearPartida(C, semilla, n));
  const DURACION = { 1: 10, 2: 10, 3: 10 };
  let reloj = null;

  function boton(texto, fn, clase, attrs) {
    const b = el('<button type="button" class="' + (clase || '') + '"' + (attrs || '') + '>' + esc(texto) + '</button>');
    b.addEventListener('click', fn);
    return b;
  }
  function seccion(clase, html) { return el('<section class="' + clase + '">' + html + '</section>'); }
  const parrafos = lista => lista.map(p => '<p>' + esc(p) + '</p>').join('');
  function plegable(titulo, html, abierto, clase) {
    return el('<details class="' + (clase || 'panel') + '"' + (abierto ? ' open' : '') + '><summary>' + esc(titulo) + '</summary><div class="cuerpo">' + html + '</div></details>');
  }
  function cabecera() {
    return el('<header class="cab"><p class="hotel">' + esc(C.ambiente) + '</p><p class="marca">' + esc(C.titulo) + ' · <span>' + esc(C.subtitulo) + '</span></p></header>');
  }

  function identidad() {
    const h = location.hash;
    const m = /^#j=([0-9A-Za-z-]{6,8})$/.exec(h);
    if (m) { const t = M.decodificarToken(m[1]); if (t) return { tipo: 'jugador', token: M.normalizarToken(m[1]), datos: t }; }
    if (h === '#anfitrion' && leer('anfitrion')) return { tipo: 'anfitrion' };
    return { tipo: 'inicio' };
  }
  function pintar(arriba) {
    clearInterval(reloj);
    app.innerHTML = '';
    app.append(cabecera());
    const id = identidad();
    if (id.tipo === 'jugador') pantallaJugador(id);
    else if (id.tipo === 'anfitrion') pantallaAnfitrion();
    else pantallaInicio();
    if (arriba) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => pintar(true));
  const ir = hash => { if (location.hash === hash) pintar(true); else location.hash = hash; };

  // ---------- Inicio ----------
  function pantallaInicio() {
    app.append(el('<h1 class="titulo">' + esc(C.titulo) + '</h1>'));
    app.append(el('<p class="sub">' + esc(C.subtitulo) + ' · ' + esc(U('subInicio')) + '</p>'));
    app.append(seccion('panel como', '<h2>' + esc(U('comoTitulo')) + '</h2><ol>' + C.textos.como.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>'));
    app.append(boton(U('crear'), pantallaCrear, '', ' data-accion="crear"'));
    app.append(boton(U('unirme'), pantallaUnirme, 'sec', ' data-accion="unirme"'));
    const a = leer('anfitrion');
    if (a) app.append(boton(U('seguir'), () => ir('#anfitrion'), 'sec'));
    app.append(el('<p class="nota">' + esc(U('notaPrototipo')) + '</p>'));
  }
  function pantallaCrear() {
    app.innerHTML = ''; app.append(cabecera());
    app.append(el('<h1 class="titulo">' + esc(U('cuantos')) + '</h1>'));
    app.append(el('<p>' + esc(U('contandote')) + '</p>'));
    const fila = el('<div class="numeros"></div>');
    for (let n = 4; n <= 8; n++) fila.append(boton(String(n), () => {
      const prev = leer('anfitrion');
      if (prev && prev.paso !== 'final' && !confirm(U('confirmarNueva'))) return;
      escribir('anfitrion', { semilla: M.nuevaSemilla(), n, paso: 'reparto', siguiente: 2, inicio: Date.now(), vista: 'partida', yo: { tachados: [] } });
      ir('#anfitrion');
    }, 'num', ' data-n="' + n + '"'));
    app.append(fila);
    app.append(boton(U('volver'), () => pintar(true), 'sec'));
  }
  function pantallaUnirme() {
    app.innerHTML = ''; app.append(cabecera());
    app.append(el('<h1 class="titulo">' + esc(U('unirmeTitulo')) + '</h1>'));
    const f = el('<div class="panel"><label for="cod">' + esc(U('unirmeEtiqueta')) + '</label><input id="cod" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-123" maxlength="8"><div class="error" role="alert"></div></div>');
    const inp = f.querySelector('input'), err = f.querySelector('.error');
    const entrar = () => { const t = M.decodificarToken(inp.value); if (!t) { err.textContent = U('codigoNoValido'); return; } ir('#j=' + M.codificarToken(t.semilla, t.n, t.asiento)); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
    f.append(boton(U('entrar'), entrar, '', ' data-accion="entrar"'));
    app.append(f);
    app.append(boton(U('volver'), () => pintar(true), 'sec'));
    inp.focus();
  }

  // ---------- Elegir versión (masculina o femenina) ----------
  function elegirVersion(cont, partida, asiento, alElegir) {
    const p = C.personajes.find(x => x.id === partida.asientos[asiento - 1]);
    cont.append(seccion('panel aviso', '<p class="etq">' + esc(U('soloParaTi')) + '</p><p>' + esc(U('secretoAviso')) + '</p>'));
    cont.append(el('<h1 class="titulo">' + esc(U('teHaTocado')) + '</h1>'));
    cont.append(el('<p>' + esc(U('queVersion')) + '</p>'));
    for (const g of ['M', 'F']) cont.append(boton(p.nombres[g], () => alElegir(g), 'grande', ' data-g="' + g + '"'));
  }

  // ---------- Vista de un personaje (jugadores y anfitrión) ----------
  function htmlTarjeta(tj) {
    return '<p class="presentacion">' + esc(tj.presentacion) + '</p>' +
      '<h3>' + esc(U('hSecreto')) + '</h3><p>' + esc(tj.secreto) + '</p>' +
      '<h3>' + esc(U('hRelacion')) + '</h3><p>' + esc(tj.relacion) + '</p>' +
      '<h3>' + esc(U('hCoartada')) + '</h3><ul class="horas">' + tj.coartada.map(c => '<li><b>' + esc(c.hora) + '</b> ' + esc(c.texto) + '</li>').join('') + '</ul>' +
      '<h3>' + esc(U('hSenas')) + '</h3><ul>' + tj.senas.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>' +
      '<div class="papel" data-papel="' + (tj.papel.culpable ? 'culpable' : 'inocente') + '"><p class="papel-t">' + esc(tj.papel.titulo) + '</p>' + parrafos(tj.papel.texto) + '</div>' +
      htmlKit(tj.kit);
  }
  // Kit de cada ronda: igual para inocentes y culpable (mismas secciones, misma longitud)
  function htmlKit(k) {
    if (!k) return '';
    return '<div class="kit"><h3>' + esc(U('hDecir')) + '</h3><ul class="decir">' + k.decir.map(d => '<li>' + esc(d) + '</li>').join('') + '</ul>' +
      '<h3>' + esc(U('hPregunta')) + '</h3><p class="preg"><b>' + esc(k.pregunta.q) + '</b><br>' + esc(k.pregunta.a) + '</p>' +
      '<h3>' + esc(U('hJugada')) + '</h3><p>' + esc(k.jugada) + '</p></div>';
  }
  const htmlPrivado = pr => parrafos(pr.situacion) + htmlKit(pr.kit);
  function htmlPublico(pub) {
    let h = parrafos(pub.parrafos);
    if (pub.regla) h += '<p class="regla">' + esc(pub.regla) + '</p>';
    if (pub.instruccion) h += '<p>' + esc(pub.instruccion) + '</p>';
    if (pub.declaraciones && pub.declaraciones.length) h += '<ul class="decl">' + pub.declaraciones.map(d => '<li>' + esc(d) + '</li>').join('') + '</ul>';
    if (pub.cierre) h += '<p class="cierre">' + esc(pub.cierre) + '</p>';
    return h;
  }
  function htmlCuaderno(partida, yo, tachados) {
    let h = '<p class="nota">' + esc(U('cuadernoNota')) + '</p><table class="cuaderno"><thead><tr><th></th>' + C.momentos.map(m => '<th>' + esc(m) + '</th>').join('') + '</tr></thead><tbody>';
    for (const f of M.cuaderno(C, partida)) {
      h += '<tr data-id="' + esc(f.id) + '" class="' + (tachados.indexOf(f.id) >= 0 ? 'tachado' : '') + '"><td><b>' + esc(f.apellido) + (f.id === yo ? ' ' + U('tuMarca') : '') + '</b><small>' + esc(f.rol) + '<br>' + esc(f.senas.join(' · ')) + '</small></td>' + f.horas.map(x => '<td>' + esc(x) + '</td>').join('') + '</tr>';
    }
    return h + '</tbody></table>';
  }
  function htmlRevelacion(rv) {
    return '<h2 class="fue">' + esc(rv.titulo) + '</h2>' + parrafos(rv.parrafos) + '<p class="ironia">' + esc(rv.ironia) + '</p>' +
      '<h3>' + esc(U('hComoSaber')) + '</h3><ol>' + rv.como.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
      '<h3>' + esc(U('hSecretosMesa')) + '</h3><ul>' + rv.secretos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  }

  // st: { g, ronda (1, 2, 3 o 5 = revelado), voto, tachados, fallos, bloqueo }
  function vistaPersonaje(cont, partida, asiento, st, guardar, esAnfitrion) {
    const r = st.ronda;
    const tj = M.tarjeta(C, partida, asiento, st.g);
    const yo = partida.asientos[asiento - 1];
    cont.append(el('<div class="fila-cab"><span class="chip" data-ronda="' + r + '">' + esc(r >= 5 ? U('final') : U('rondaDe', { r })) + '</span>' + '<span class="mesa" data-mesa="' + M.nombreMesa(partida.semilla) + '">' + esc(U('mesa', { mesa: M.nombreMesa(partida.semilla) })) + '</span>' + '</div>'));
    // Botón «Tapar» siempre visible abajo, en todos los móviles (también el del anfitrión)
    const tapar = boton(U('tapar'), () => { const t = el('<div class="telon" role="button" data-telon="1"><p>' + esc(U('tapada')) + '</p><p><small>' + esc(U('tocaVolver')) + '</small></p></div>'); t.addEventListener('click', () => t.remove()); document.body.append(t); }, 'tapar-fijo', ' data-accion="tapar"');
    cont.append(tapar);
    cont.append(el('<h1 class="nombre" data-personaje="' + esc(yo) + '">' + esc(tj.nombre) + '</h1>'));

    if (r >= 5) {
      const rv = M.revelacion(C, partida);
      let res;
      if (yo === rv.culpable) res = M.genero(U('resCulpable'), st.g);
      else if (st.voto === rv.culpable) res = M.genero(U('resAcierto'), st.g);
      else res = st.voto ? M.genero(U('resFallo', { s: AP(st.voto) }), st.g) : M.genero(U('resNoVoto'), st.g);
      cont.append(seccion('panel revelacion', '<p class="resultado" data-resultado="' + (yo === rv.culpable ? 'culpable' : st.voto === rv.culpable ? 'acierto' : 'fallo') + '">' + esc(res) + '</p>' + htmlRevelacion(rv)));
    }
    if (r >= 2 && r <= 3) {
      const pr = M.privado(C, partida, asiento, st.g, r);
      cont.append(seccion('carta nueva', '<p class="etq">' + esc(U('etqPrivada', { r })) + '</p>' + htmlPrivado(pr)));
    }
    if (r === 1) cont.append(seccion('panel guia', '<p><b>' + esc(U('guiaR1Titulo')) + '</b> ' + esc(U('guiaR1')) + '</p><p class="regla-inventar">' + esc(C.textos.reglaInventar) + '</p>'));
    if (r === 1) cont.append(plegable(U('tuPapel'), htmlTarjeta(tj), true, 'carta papel-carta'));
    if (r === 3) cont.append(votoUI(partida, yo, st, guardar));
    if (!esAnfitrion && r < 3) cont.append(formCodigo(partida, r + 1, st, guardar));
    if (!esAnfitrion && r === 3) cont.append(formCodigo(partida, 4, st, guardar));

    if (r !== 1) cont.append(plegable(U('tuPapel'), htmlTarjeta(tj), false, 'carta papel-carta'));
    if (r >= 1 && r <= 3) cont.append(plegable(U('loLeido', { r }), htmlPublico(M.publico(C, partida, r)), r > 1, 'panel publico'));
    const cu = plegable(U('cuaderno'), htmlCuaderno(partida, yo, st.tachados || []), false, 'panel');
    cu.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
      st.tachados = st.tachados || [];
      const i = st.tachados.indexOf(tr.dataset.id);
      if (i >= 0) st.tachados.splice(i, 1); else st.tachados.push(tr.dataset.id);
      tr.classList.toggle('tachado'); guardar();
    }));
    cont.append(cu);
    for (let k = Math.min(r, 4) - 1; k >= 2; k--) {
      if (k > 3) continue;
      cont.append(plegable(U('antPrivado', { r: k }), htmlPrivado(M.privado(C, partida, asiento, st.g, k)), false, 'carta'));
      cont.append(plegable(U('antPublico', { r: k }), htmlPublico(M.publico(C, partida, k)), false, 'panel'));
    }
    cont.append(seccion('nota regla-pie', '<p>' + esc(C.textos.regla) + '</p><p class="regla-inventar" data-regla="inventar">' + esc(C.textos.reglaInventar) + '</p>'));
  }

  function votoUI(partida, yo, st, guardar) {
    const s = seccion('panel voto', '<p class="etq">' + esc(U('tuVoto')) + '</p>');
    if (st.voto) {
      s.append(el('<p class="grande" data-voto="' + esc(st.voto) + '">' + esc(U('acusas', { s: AP(st.voto) })) + '</p>'));
      s.append(el('<p class="nota">' + esc(U('ensena')) + '</p>'));
      if (st.ronda < 5) s.append(boton(U('cambiarVoto'), () => { st.voto = null; guardar(); pintar(); }, 'sec'));
      return s;
    }
    s.append(el('<p>' + esc(U('eligeAcusar')) + '</p>'));
    for (const id of partida.asientos.slice().sort((a, b) => C.personajes.find(p => p.id === a).n - C.personajes.find(p => p.id === b).n)) {
      if (id === yo) continue;
      s.append(boton(U('acuso', { s: AP(id) }), () => { st.voto = id; guardar(); pintar(); }, 'sec voto-op', ' data-acusar="' + esc(id) + '"'));
    }
    return s;
  }

  function formCodigo(partida, objetivo, st, guardar) {
    const etiqueta = objetivo === 4 ? U('etqCodigoSolucion') : U('etqCodigoRonda', { r: objetivo });
    const f = seccion('panel codigo', '<label>' + esc(etiqueta) + '</label><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="···" data-objetivo="' + objetivo + '"><div class="error" role="alert"></div>');
    const inp = f.querySelector('input'), err = f.querySelector('.error');
    const probar = () => {
      const ahora = Date.now();
      if (st.bloqueo && ahora < st.bloqueo) { err.textContent = U('demasiados'); return; }
      if (inp.value.trim() === partida.codigos[objetivo]) { st.ronda = objetivo === 4 ? 5 : objetivo; st.fallos = 0; guardar(); pintar(true); return; }
      st.fallos = (st.fallos || 0) + 1;
      if (st.fallos >= 5) { st.bloqueo = ahora + 15000; st.fallos = 0; }
      guardar();
      err.textContent = U('noEsCodigo');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') probar(); });
    f.append(boton(objetivo === 4 ? U('verSolucion') : U('abrirRonda', { r: objetivo }), probar, '', ' data-accion="codigo"'));
    return f;
  }

  // ---------- Jugador ----------
  function pantallaJugador(id) {
    const { semilla, n, asiento } = id.datos;
    const partida = partidaDe(semilla, n);
    const clave = 'j:' + id.token;
    const st = leer(clave) || { ronda: 1, tachados: [] };
    const guardar = () => escribir(clave, st);
    if (!st.g) return elegirVersion(app, partida, asiento, g => { st.g = g; guardar(); pintar(true); });
    vistaPersonaje(app, partida, asiento, st, guardar, false);
  }

  // ---------- Anfitrión ----------
  const RONDA_DE_PASO = { listo: 1, r1: 1, r2: 2, r3: 3, voto: 3, final: 5 };
  function pantallaAnfitrion() {
    const st = leer('anfitrion');
    const partida = partidaDe(st.semilla, st.n);
    const guardar = () => escribir('anfitrion', st);
    if (st.paso === 'reparto') return pantallaReparto(st, partida, guardar);
    const nav = el('<nav class="pestanas"><button type="button" data-v="partida">' + esc(U('pestPartida')) + '</button><button type="button" data-v="personaje">' + esc(U('pestPersonaje')) + '</button></nav>');
    nav.querySelectorAll('button').forEach(b => {
      if (b.dataset.v === (st.vista || 'partida')) b.classList.add('activa');
      b.addEventListener('click', () => { st.vista = b.dataset.v; guardar(); pintar(true); });
    });
    app.append(nav);
    if (st.vista === 'personaje') {
      const yo = st.yo || (st.yo = { tachados: [] });
      yo.ronda = RONDA_DE_PASO[st.paso];
      const g2 = () => { guardar(); };
      if (!yo.g) return elegirVersion(app, partida, 1, g => { yo.g = g; guardar(); pintar(true); });
      return vistaPersonaje(app, partida, 1, yo, g2, true);
    }
    panelPartida(st, partida, guardar);
  }

  function urlJugador(partida, asiento) { return location.href.split('#')[0] + '#j=' + M.codificarToken(partida.semilla, partida.n, asiento); }
  function bloqueQR(partida, asiento) {
    const token = M.codificarToken(partida.semilla, partida.n, asiento);
    const url = urlJugador(partida, asiento);
    const q = Q.generar(url);
    window.__ultimoQR = { texto: url, modulos: q.modulos };
    const b = el('<div class="qr-bloque"><div class="qr" data-qr-version="' + q.version + '">' + Q.svg(url, 4) + '</div><p class="nota">' + esc(U('qrNota')) + '</p><p class="token" data-token="' + esc(token) + '">' + esc(token) + '</p></div>');
    b.append(boton(U('copiar'), async e => {
      try { await navigator.clipboard.writeText(url); e.target.textContent = U('copiado'); }
      catch (x) { const i = el('<input type="text" readonly class="enlace">'); i.value = url; b.append(i); i.select(); }
    }, 'sec pequeno'));
    return b;
  }

  function pantallaReparto(st, partida, guardar) {
    const k = st.siguiente;
    app.append(el('<p class="etq">' + esc(U('repartir')) + '</p>'));
    app.append(el('<h1 class="titulo">' + esc(U('jugadorDe', { k, n: st.n })) + '</h1>'));
    app.append(el('<p>' + esc(U('escanea')).replace('{mesa}', '<b>' + esc(U('mesa', { mesa: M.nombreMesa(partida.semilla) })) + '</b>') + '</p>'));
    app.append(bloqueQR(partida, k));
    app.append(boton(k < st.n ? U('siguienteJugador') : U('estamosTodos'), () => {
      if (k < st.n) st.siguiente = k + 1; else { st.paso = 'listo'; st.vista = 'personaje'; }
      guardar(); pintar(true);
    }, '', ' data-accion="siguiente"'));
    if (k > 2) app.append(boton(U('anterior'), () => { st.siguiente = k - 1; guardar(); pintar(true); }, 'sec'));
    if (st.otraVez) app.append(el('<p class="nota"><b>' + esc(U('otraVezTitulo', { k: (st.historial || []).length + 1 })) + '</b> ' + esc(U('otraVezNota')) + '</p>'));
    app.append(el('<p class="nota">' + esc(U('eresJugador1')) + '</p>'));
  }

  function temporizador(desde, minutos) {
    const t = el('<p class="tiempo" aria-live="off"></p>');
    const act = () => { const s = Math.max(0, Math.floor((Date.now() - desde) / 1000)); t.textContent = U('llevamos', { t: Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') }) + (minutos ? U('unosMinutos', { m: minutos }) : ''); };
    act(); reloj = setInterval(act, 1000);
    return t;
  }

  function panelPartida(st, partida, guardar) {
    const avanzar = paso => { st.paso = paso; st.inicio = Date.now(); guardar(); pintar(true); };
    const p = st.paso;
    if (p === 'listo') {
      app.append(el('<h1 class="titulo">' + esc(U('todosDentro')) + '</h1>'));
      app.append(el('<p>' + esc(U('miraPersonaje')) + '</p>'));
      app.append(boton(U('empezarR1'), () => avanzar('r1'), '', ' data-accion="r1"'));
      app.append(otraVezQR(partida));
      return;
    }
    const ronda = { r1: 1, r2: 2, r3: 3 }[p];
    if (ronda) {
      const pub = M.publico(C, partida, ronda);
      app.append(el('<p class="chip">' + esc(U('rondaDe', { r: ronda })) + '</p>'));
      app.append(el('<h1 class="titulo">' + esc(pub.titulo.split('·')[1] || pub.titulo) + '</h1>'));
      app.append(temporizador(st.inicio, DURACION[ronda]));
      if (ronda >= 2) app.append(seccion('panel codigo-grande', '<p>' + esc(U('diCodigo')) + '</p><p class="digitos" data-codigo="' + partida.codigos[ronda] + '">' + partida.codigos[ronda] + '</p><p class="nota">' + esc(U('cadaUnoEscribe')) + '</p>'));
      app.append(seccion('panel leer', '<p class="etq">' + esc(U('leeVozAlta')) + '</p>' + htmlPublico(pub)));
      const sig = { 1: [U('pasarR2'), 'r2'], 2: [U('pasarR3'), 'r3'], 3: [U('pasarVoto'), 'voto'] }[ronda];
      app.append(boton(sig[0], () => avanzar(sig[1]), '', ' data-accion="' + sig[1] + '"'));
      app.append(otraVezQR(partida));
      return;
    }
    if (p === 'voto') {
      app.append(el('<p class="chip">' + esc(U('votacion')) + '</p>'));
      app.append(el('<h1 class="titulo">' + esc(U('quienFue')) + '</h1>'));
      app.append(seccion('panel leer', '<p class="etq">' + esc(U('leeVozAlta')) + '</p><p>' + esc(C.textos.voto) + '</p>'));
      app.append(el('<p>' + esc(U('tuTambienVotas')) + '</p>'));
      app.append(boton(U('revelar'), () => { if (confirm(U('confirmarRevelar'))) avanzar('final'); }, '', ' data-accion="revelar"'));
      return;
    }
    if (p === 'final') {
      app.append(seccion('panel codigo-grande', '<p>' + esc(U('diCodigoSolucion')) + '</p><p class="digitos" data-codigo="' + partida.codigos[4] + '">' + partida.codigos[4] + '</p>'));
      app.append(seccion('panel revelacion', '<p class="etq">' + esc(U('leeVozAlta')) + '</p>' + htmlRevelacion(M.revelacion(C, partida))));
      app.append(boton(U('otraPartida'), () => {
        const historial = (st.historial || []).concat([st.semilla]);
        escribir('anfitrion', { semilla: M.semillaSiguiente(C, historial, st.n), n: st.n, paso: 'reparto', siguiente: 2, inicio: Date.now(), vista: 'partida', yo: { tachados: [] }, otraVez: true, historial });
        pintar(true);
      }, '', ' data-accion="otra"'));
      app.append(boton(U('salir'), () => { location.hash = ''; }, 'sec'));
    }
  }

  function otraVezQR(partida) {
    const d = el('<details class="panel"><summary>' + esc(U('perdido')) + '</summary><div class="cuerpo"><p class="nota">' + esc(U('perdidoNota')) + '</p><div class="numeros"></div><div class="hueco"></div></div></details>');
    const fila = d.querySelector('.numeros'), hueco = d.querySelector('.hueco');
    for (let k = 2; k <= partida.n; k++) fila.append(boton(String(k), () => { hueco.innerHTML = ''; hueco.append(bloqueQR(partida, k)); }, 'num sec'));
    return d;
  }

  pintar(false);
})();

</script>
</body>
</html>
