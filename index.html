<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11161d">
<title>Uno di Voi · El último fallo · partida rápida</title>
<style>
:root{--fondo:#11161d;--panel:#1a212b;--borde:#2c3644;--texto:#ece6d8;--suave:#a7adb6;--oro:#d9a441;--hortensia:#8fa9dc;--papel:#f4ecd8;--tinta:#2a2118;--mal:#e3826f;--ok:#7cc79a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);background-image:radial-gradient(circle at 50% -20%,#22324a 0,transparent 60%);color:var(--texto);font:18px/1.5 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 56px}
.cab{text-align:center;border-bottom:1px solid var(--borde);padding:6px 0 10px;margin-bottom:12px}
.hotel{margin:0;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
.marca{margin:2px 0 0;font-size:.85rem;color:var(--suave);font-style:italic}.marca span{font-style:normal}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;line-height:1.2}
.titulo{font-size:1.75rem;margin:.3em 0 .2em}.sub{color:var(--suave);margin-top:0}
.nombre{font-size:1.9rem;margin:.2em 0 .4em;color:var(--oro)}
h2{font-size:1.25rem;color:var(--oro);margin:.2em 0 .5em}h3{font-size:1rem;margin:1em 0 .3em;color:var(--hortensia);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px 16px;margin:12px 0}
.carta{background:var(--papel);color:var(--tinta);border-radius:6px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 0 #b9a77f,0 6px 18px rgba(0,0,0,.35);border:1px solid #d8c9a3}
.carta h3{color:#6b4f1d}.carta summary{color:#6b4f1d}
.carta.nueva{border-left:6px solid var(--oro)}
.etq{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin:0 0 6px}
.carta .etq{color:#8a6420}
summary{cursor:pointer;font-weight:bold;color:var(--oro);padding:2px 0;list-style-position:outside}
details .cuerpo{margin-top:8px}
button{display:block;width:100%;font:inherit;font-weight:bold;margin:10px 0;padding:14px;border-radius:12px;border:0;background:var(--oro);color:#1c1406;cursor:pointer;min-height:52px}
button.sec{background:transparent;color:var(--texto);border:1px solid var(--borde);font-weight:normal}
button.grande{font-size:1.15rem;background:var(--papel);color:var(--tinta)}
button.pequeno{min-height:40px;padding:8px;font-size:.9rem}
.numeros{display:flex;gap:8px;flex-wrap:wrap}.numeros button{flex:1;min-width:52px;font-size:1.3rem}
input[type=text]{width:100%;font:inherit;font-size:1.3rem;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#0c1015;color:var(--texto);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.codigo input{text-align:center;font-size:1.8rem;letter-spacing:.4em}
.error{color:var(--mal);min-height:1.3em;font-size:.95rem;margin-top:6px}
.nota{color:var(--suave);font-size:.88rem}
.carta .nota{color:#6d6250}
.como ol{padding-left:1.2em;margin:0}.como li{margin:.35em 0}
.chip{display:inline-block;background:#24324a;color:var(--hortensia);border:1px solid #34486a;border-radius:999px;padding:3px 12px;font-size:.85rem;letter-spacing:.05em;margin:4px 0}
.fila-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mesa{font-size:.75rem;color:var(--suave);letter-spacing:.08em;margin-left:auto}
/* v2 (fase 2d): barra fija de abajo con 3 pestañas y «Tapar»; no tapa el código ni los botones (main deja sitio) */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(12,16,21,.97);border-top:1px solid var(--borde);box-shadow:0 -6px 18px rgba(0,0,0,.55);max-width:560px;margin:0 auto}
.barra button{flex:1 1 0;margin:0;min-height:52px;padding:6px 2px;font-size:.82rem;line-height:1.15;border-radius:10px;background:transparent;color:var(--suave);border:1px solid var(--borde);font-weight:normal}
.barra button.activa{color:var(--oro);border-color:var(--oro);background:var(--panel);font-weight:bold}
.barra .tapar-fijo{flex:0 0 22%;background:#0c1015;color:var(--oro);border:2px solid var(--oro);font-weight:bold;letter-spacing:.03em}
main{padding-bottom:76px}.juego .carta,.juego .turno{margin:10px 0}
.juego .marca{display:none}.juego .nombre{font-size:1.6rem;margin:.1em 0 .3em}.juego .cab{padding:2px 0 6px;margin-bottom:6px}.hotel{letter-spacing:.1em;font-size:.66rem}
.horas-linea{margin:2px 0 6px;font-size:.95rem}.horas-linea b{color:var(--oro)}.horas-linea span{white-space:nowrap}
.fila-codigo{display:flex;gap:8px;align-items:stretch}.fila-codigo input{flex:1 1 40%;margin:6px 0 0;min-width:0}.fila-codigo button{flex:1 1 60%;margin:6px 0 0;padding:8px}
.codigo label{display:block;font-size:.95rem}.codigo .error{min-height:0}
.mas .regla-inventar{font-size:.9rem;margin:10px 0 0}
.fila-cab .ayuda-btn{width:auto;min-height:36px;margin:0 0 0 8px;padding:2px 13px;border-radius:999px;background:transparent;color:var(--oro);border:1px solid var(--oro);font-size:1rem}
.selector{display:flex;align-items:center;gap:6px;margin:2px 0 6px;font-size:.85rem;color:var(--suave)}.selector span{margin-right:2px}
.selector .pill{width:auto;flex:1;margin:0;min-height:40px;padding:4px 6px;border-radius:999px;background:transparent;color:var(--texto);border:1px solid var(--borde);font-weight:normal;font-size:.9rem}
.selector .pill.activa{background:var(--oro);color:#1c1406;border-color:var(--oro);font-weight:bold}.selector .pill:disabled{opacity:.35;cursor:default}
.banda{background:var(--oro);color:#1c1406;border-radius:10px;padding:8px 14px;margin:6px 0 10px}.banda p{margin:0}.banda .banda-t{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:bold;opacity:.8}
.banda.pasada{background:var(--panel);color:var(--texto);border:1px dashed var(--suave)}.banda.pasada button{margin:8px 0 0}
.privada{padding-top:10px}.privada .pieza+.pieza{border-top:1px dashed #cdbd95;margin-top:8px;padding-top:2px}.privada .pieza p{margin:.35em 0}.privada h3{margin:.5em 0 .1em}
.et-privado::before{content:"\1F512  "}.et-turno::before{content:"\1F4AC  "}
.sello{display:inline-block;margin:2px 0 4px;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:bold;letter-spacing:0}
.sello-guarda{background:#7a2e22;color:#fbe9e4}.sello-cuenta,.sello-usa{background:#2f5d43;color:#e6f6ec}
/* v2.1: línea «Y cuenta también lo que sabes», cuaderno con nombres que se tachan, aviso del anfitrión, revelación corta */
.turno .cuenta-tambien{margin:2px 0 4px;font-size:.92rem;font-weight:bold;color:var(--hortensia)}
.tablero .nombre-fila{display:block;width:100%;margin:0;padding:2px 0;min-height:0;text-align:left;background:transparent;color:var(--texto);border:0;border-radius:4px;font-weight:bold;font-size:.95rem}
.tablero tr.tachada .nombre-fila{text-decoration:line-through;color:var(--suave)}.tablero tr.tachada small,.tablero tr.tachada .celda{opacity:.35}
.tablero .fuera{display:inline-block;margin-left:4px;font-size:.7rem;font-weight:normal;font-style:italic;text-decoration:none;color:var(--hortensia)}
.aviso-juegas{border-left:4px solid var(--hortensia);padding:4px 10px;margin:6px 0;font-size:.9rem;color:var(--texto)}
.revelacion-corta .fue{font-size:2.2rem;margin:.1em 0 .3em}.revelacion-corta .esencial{font-size:1.1rem}
.carta button.sec{color:var(--tinta);border-color:#b9a77f;background:#efe4c8}.carta button.pequeno{min-height:36px;padding:6px;margin:8px 0 2px}.juego .chip{margin:2px 0}
.turno{background:var(--panel);border:1px solid var(--borde);border-left:6px solid var(--hortensia);border-radius:12px;padding:10px 16px;margin:12px 0}
.turno .etq{color:var(--hortensia)}.turno .orden{font-size:.8rem;color:var(--suave);margin:0 0 6px}.turno .pre{margin:4px 0 2px;font-size:.92rem}
.turno .frase{font-size:1.12rem;font-style:italic;margin:.4em 0;color:var(--texto)}
.horas.corto li{padding:2px 0;border-bottom:0}.horas.corto b{color:var(--oro)}
.mas{margin:6px 0 4px}.mas summary{color:var(--hortensia);font-size:.95rem}.mas h3{margin:.7em 0 .2em}.mas p{margin:.2em 0}
.turno .regla-inventar{font-size:.82rem;margin:8px 0 0}
.pila h2{color:#6b4f1d;margin:.1em 0 .4em}.nav-pila{display:flex;gap:8px}.nav-pila button{margin:4px 0 10px}.nav-pila button:disabled{opacity:.35;cursor:default}
.leer-t{font-size:1.15rem;line-height:1.55;margin:.2em 0}.anf-turno .frase{font-weight:bold}
.tablero{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px}.tablero th{color:var(--oro);font-weight:normal;font-size:.72rem;padding:4px 2px;text-align:center;vertical-align:bottom}
.tablero td{padding:6px 2px;border-top:1px solid var(--borde);vertical-align:middle;text-align:center}.tablero td:first-child{text-align:left}.tablero small{display:block;color:var(--suave);font-size:.72rem;line-height:1.3}.tablero u{color:var(--texto)}
.tablero .celda{width:42px;min-height:42px;height:42px;margin:0 auto;padding:0;border-radius:8px;background:#0c1015;border:1px solid var(--borde);color:var(--oro);font-size:1.3rem}.tablero .celda.si{border-color:var(--oro);background:#2a2214}
.preguntas{margin:6px 0;font-size:.85rem}.preguntas dt{color:var(--oro);font-weight:bold;float:left;clear:left;margin-right:6px}.preguntas dd{margin:0 0 4px}
.ayuda{position:fixed;inset:0;z-index:9;background:rgba(8,10,14,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.ayuda-caja{background:var(--papel);color:var(--tinta);border-radius:10px;max-width:520px;width:100%;padding:16px 18px;max-height:100%;overflow:auto}.ayuda-caja .etq{color:#8a6420}
.pasos{padding-left:1.3em;margin:6px 0}.pasos li{margin:.5em 0;font-size:1.05rem}.pasos .dos{display:block;margin-top:4px;font-size:.98rem}.ayuda-caja .nota{color:#6d6250}
.kit{margin-top:14px;border-top:1px dashed #cdbd95;padding-top:4px}.kit .decir{padding-left:1.1em}.kit .decir li{margin:.35em 0;font-style:italic}.preg b{display:inline-block;margin-bottom:2px}
.telon{position:fixed;inset:0;background:#0b0e12;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;z-index:10}.telon p{margin:.2em}
.presentacion{font-style:italic}
.horas{list-style:none;padding:0;margin:0}.horas li{padding:6px 0;border-bottom:1px dashed #cdbd95}.horas b{display:inline-block;min-width:3.4em;color:#6b4f1d}
.papel{margin-top:14px;padding:10px 12px;border-radius:6px;background:#e9dfc4;border:1px solid #cdbd95}
.papel-t{font-weight:bold;font-size:1.1rem;margin:0 0 4px}
/* El recuadro del culpable es idéntico al de los inocentes: que no se distinga de un vistazo. */
.regla{border-left:4px solid var(--oro);padding-left:10px;font-weight:bold}
.decl{padding-left:1.1em}.decl li{margin:.4em 0}
.cierre{color:var(--hortensia);font-style:italic}
.leer{border-left:4px solid var(--hortensia)}
.codigo-grande{text-align:center}.digitos{font-size:3.4rem;letter-spacing:.25em;margin:.1em 0;color:var(--oro);font-family:'Courier New',monospace;font-weight:bold}
.tiempo{color:var(--suave);font-size:.95rem;margin:0}
.pestanas{display:flex;gap:6px;margin:4px 0 8px}.pestanas button{margin:0;min-height:44px;padding:8px;background:transparent;color:var(--suave);border:1px solid var(--borde);font-weight:normal}
.pestanas button.activa{background:var(--panel);color:var(--oro);border-color:var(--oro);font-weight:bold}
.qr-bloque{text-align:center}.qr{background:#fff;border-radius:10px;padding:6px;max-width:300px;margin:8px auto}.qr svg{display:block;width:100%;height:auto}
.token{font-family:'Courier New',monospace;font-size:2rem;letter-spacing:.12em;color:var(--oro);margin:.2em 0;font-weight:bold}
.enlace{font-size:.8rem;letter-spacing:0;text-transform:none}
.cuaderno{width:100%;border-collapse:collapse;font-size:.85rem}.cuaderno th{text-align:left;color:var(--oro);font-weight:normal;padding:4px}
.cuaderno td{padding:6px 4px;border-top:1px solid var(--borde);vertical-align:top}.cuaderno small{display:block;color:var(--suave);font-size:.75rem}
.cuaderno tr.tachado td{opacity:.35;text-decoration:line-through}
.voto .grande{font-size:1.4rem;color:var(--oro);margin:.2em 0}
.revelacion .fue{font-size:1.8rem;color:var(--oro)}.ironia{font-style:italic;border-left:4px solid var(--hortensia);padding-left:10px}
.resultado{font-size:1.3rem;font-weight:bold}.resultado[data-resultado=acierto]{color:var(--ok)}.resultado[data-resultado=fallo]{color:var(--mal)}
.aviso{border-color:var(--oro)}
.regla-pie p{margin:18px 0 0;text-align:center}
.regla-inventar{font-weight:bold;color:var(--oro)}.guia .regla-inventar{margin-top:6px}
</style>
</head>

  const lugarDe = (C, id, hora) => P(C, id).coartada[hora];
  const tieneSena = (C, id, sena) => P(C, id).senas.indexOf(sena) >= 0;
  const porN = C => (a, b) => P(C, a).n - P(C, b).n;
  function personalEn(C, lugar, hora) { const x = C.lugares[lugar] && C.lugares[lugar].personal; return x && x.horas.indexOf(hora) >= 0 ? x : null; }
  function documentoEn(C, lugar, hora) { const x = C.lugares[lugar] && C.lugares[lugar].documento; return x && x.horas.indexOf(hora) >= 0 ? x : null; }
  function genero(texto, g) { return String(texto).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (m, a, b) => (g === 'F' ? b : a)); }

  function fx(C, k) { const x = C.motor && C.motor[k]; if (typeof x !== 'string') throw new Error('Falta el texto fijo motor.' + k); return x; }

    return nombres.slice(0, -1).join(', ') + ' ' + fx(C, 'y') + ' ' + nombres[nombres.length - 1];
  }
  function nombreLugar(C, lugar, hora) {
    const l = C.lugares[lugar];

  }

  // ---------- Tardes intercambiables (E1) ----------
  // Campos que cambian con la tarde; el resto del personaje (nombre, presentación, voz, señas) es fijo.
  const CAMPOS_TARDE = ['coartada', 'detalle', 'tuTarde', 'secreto', 'rumor', 'defensaSecreto', 'relacion', 'sospecha', 'decirR1', 'preguntaR1'];
  const base = C => C._base || C;
  function tardesDe(C, id) { const p = P(base(C), id); return p.tardes && p.tardes.length ? p.tardes.map(t => t.id) : [id + '-a']; }

  function variantesDeTarde(C, id, tarde) { return base(C).variantes.filter(v => v.culpable === id && tardeDeVariante(C, v) === tarde); }
  // El contenido «visto» con unas tardes: cada personaje lleva los campos de su tarde (P(C, id).coartada, etc.).
  // Se guarda en caché (una por combinación de tardes); los personajes que no se indican, con su primera tarde.
  const VISTAS = typeof WeakMap !== 'undefined' ? new WeakMap() : null;
  function vista(C, tardes) {

    const elegidas = B.personajes.map(p => { const ts = tardesDe(B, p.id), t = tardes && tardes[p.id]; return ts.indexOf(t) >= 0 ? t : ts[0]; });
    const clave = elegidas.join('|');
    if (C._clave === clave) return C;

    if (VISTAS && !m) VISTAS.set(B, (m = new Map()));

  const deP = (C, partida) => vista(C, partida && partida.tardes);

  // ---------- Lógica: ¿es coherente que «h» sea el culpable con lo dicho hasta la ronda «ronda»? ----------
  function coherente(C, decl, h, ronda, hora) {
    const pos = s => (s === h ? 'B' : lugarDe(C, s, hora));
    for (const d of decl) {
      if (d.ronda > ronda) continue;
      if (d.tipo === 'PRUEBA') { if (!tieneSena(C, h, d.sena)) return false; continue; }
      if (d.fuente === h) continue; // el culpable puede mentir: lo suyo no cuenta
      if (d.tipo === 'CONF' && pos(d.sujeto) !== d.lugar) return false;
      if (d.tipo === 'NOT' && pos(d.sujeto) === d.lugar) return false;
      if (d.tipo === 'VISTA') {
        for (const s of d.vio) if (pos(s) !== d.lugar) return false;
        for (const s of d.noVio) if (pos(s) === d.lugar) return false;

  function candidatos(C, reparto, decl, ronda, hora) {
    return reparto.filter(h => coherente(C, decl, h, ronda, hora)).sort(porN(C));
  }

    // ---------- Generación de las pistas de una partida (fase 2b) ----------
  // Objetivo de duda: tras la ronda 3 la solución es única, pero SOLO si se cruza lo público con lo que
  // cuentan los móviles. Para eso:
  //  - la prueba (una seña del culpable) encaja siempre con un inocente «cebo» que tampoco tiene coartada;
  //  - el personal y los documentos solo dicen cosas PARCIALES del culpable y del cebo («no está seguro,
  //    estaba de espaldas»), las mismas palabras para los dos;
  //  - al cebo lo descarta un dato que solo está en el móvil de otro inocente («Gino te contó que…»);
  //  - cada inocente recibe en la ronda 3 al menos un dato privado que descarta o señala a alguien.
  const pruebasDe = v => v.pruebas || [{ sena: v.prueba }];
  function construirPistas(C, reparto, X, T, K, cebo, forzar, invertirSenala) {
    const orden = porN(C);
    const I = reparto.filter(c => c !== X).sort(orden);
    const L = c => lugarDe(C, c, T);
    const conPersonal = I.filter(c => personalEn(C, L(c), T));
    const sinPersonal = I.filter(c => !personalEn(C, L(c), T));
    const parciales = cebo ? [X, cebo] : [X];
    // Cada empleado declara ENTERO en la ronda 2 o se aplaza ENTERO a la 3. Se aplaza el del sitio del
    // culpable y el del cebo, y otros hasta dejar al menos 2 inocentes sin confirmar (3 sospechosos).
    const aplazados = [];
    for (const c of parciales) if (personalEn(C, L(c), T) && aplazados.indexOf(L(c)) < 0) aplazados.push(L(c));
    const sinConfirmar = () => sinPersonal.length + conPersonal.filter(c => aplazados.indexOf(L(c)) >= 0).length;
    const peso = l => [conPersonal.some(c => L(c) === l && tieneSena(C, c, K)) ? 0 : 1, conPersonal.filter(c => L(c) === l).length];
    const lugares = conPersonal.map(L).filter((l, i, a) => a.indexOf(l) === i && aplazados.indexOf(l) < 0)
      .sort((a, b) => { const pa = peso(a), pb = peso(b); return pa[0] - pb[0] || pa[1] - pb[1] || (a < b ? -1 : 1); });

    const decl = [];
    for (const c of conPersonal) {
      if (parciales.indexOf(c) >= 0) continue;
      decl.push({ tipo: 'CONF', ronda: aplazados.indexOf(L(c)) >= 0 ? 3 : 2, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, L(c), T).quien, sujeto: c, lugar: L(c), hora: T });
    }
    for (const l of aplazados) decl.push({ tipo: 'PENDIENTE', ronda: 2, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, l, T).quien, lugar: l, hora: T });
    for (const c of reparto.slice().sort(orden)) {
      const l = L(c);
      if (personalEn(C, l, T) && parciales.indexOf(c) >= 0) decl.push({ tipo: 'PARCIAL', ronda: 3, publica: true, fuente: 'npc', clase: 'personal', quien: personalEn(C, l, T).quien, sujeto: c, lugar: l, hora: T });
      else if (documentoEn(C, l, T)) decl.push({ tipo: 'PARCIAL', ronda: 3, publica: true, fuente: 'npc', clase: 'documento', quien: documentoEn(C, l, T).quien, sujeto: c, lugar: l, hora: T });

    decl.push({ tipo: 'PRUEBA', ronda: 3, publica: true, sena: K });
    // Datos privados de la ronda 3 (fase 2c):
    //  - cada dato es distinto (nunca dos sobre lo mismo) y cada uno viene de un testigo distinto;
    //  - al menos uno SEÑALA (un gesto verdadero del culpable o del cebo antes del crimen);
    //  - si hay otro inocente con la seña que la mesa no puede descartar en público, descartar al cebo
    //    exige cruzar dos móviles: el «puente» descarta al cebo y otro inocente descarta al puente.
    const datos = {}; I.forEach(w => { datos[w] = []; });
    const add = d => { decl.push(d); datos[d.fuente].push(d); return d; };
    const quitar = d => { decl.splice(decl.indexOf(d), 1); datos[d.fuente].splice(datos[d.fuente].indexOf(d), 1); };
    for (const w of I) {
      const l = L(w);
      if (!C.lugares[l].compartido) continue;
      const vio = I.filter(c => c !== w && L(c) === l), noVio = L(X) === l ? [X] : [];

    }
    const usados = new Set();
    const testigoPara = y => (C.lugares[L(y)].testigos || []).find(t => !usados.has(t.quien)) || null;
    const relevable = y => !!testigoPara(y);
    const relevo = (w, y, tipo) => { const t = testigoPara(y); usados.add(t.quien); return add({ tipo: tipo || 'CONF', ronda: 3, publica: false, fuente: w, clase: 'relevo', quien: t.quien, duda: t.duda, sujeto: y, lugar: L(y), hora: T }); };

    const descartadoEnPublico = w => !tieneSena(C, w, K) || decl.some(d => d.publica && d.tipo === 'CONF' && d.sujeto === w);
    const libre = w => !datos[w].length;
    const mejorTestigo = excluir => I.filter(w => excluir.indexOf(w) < 0)
      .sort((a, b) => (datos[a].length - datos[b].length) || ((descartadoEnPublico(b) ? 1 : 0) - (descartadoEnPublico(a) ? 1 : 0)) || orden(a, b))[0];
    // Quién recibe el dato que SEÑALA: el culpable o el cebo, alternando según el reparto
    // (invertirSenala: segunda opción, si con la primera no se puede dar el dato a otro inocente)
    const parSenala = (reparto.reduce((s, c) => s + P(C, c).n, 0) % 2 === 0) !== !!invertirSenala;
    const sujetoSenala = !cebo || parSenala ? X : cebo;
    const senalar = w => add({ tipo: 'SENALA', ronda: 3, publica: false, fuente: w, sujeto: sujetoSenala, sena: K, hora: T });
    let cadena = false;
    // 1) Despejar al cebo con un dato privado (con cadena de dos móviles si se puede)
    if (cebo && !visto(cebo)) {
      if (!relevable(cebo)) { if (!forzar) return null; }
      else {
        const pubCand = candidatos(C, reparto, decl.filter(d => d.publica), 3, T);
        const puente = I.find(c => c !== cebo && pubCand.indexOf(c) >= 0 && libre(c) && !visto(c) && relevable(c));
        const w2 = puente && I.find(w => w !== puente && w !== cebo && libre(w) && descartadoEnPublico(w));
        if (puente && w2 && L(puente) !== L(cebo)) { relevo(puente, cebo); relevo(w2, puente); cadena = true; }
        else { const w = mejorTestigo([cebo]); if (!w) { if (!forzar) return null; } else relevo(w, cebo); }
      }

    const c2 = candidatos(C, reparto, decl, 2, T);
    for (const w of I) {
      if (datos[w].length) continue;
      // (nunca al propio señalado: no puede «verse» a sí mismo)
      if (!decl.some(d => d.tipo === 'SENALA') && w !== sujetoSenala) { senalar(w); continue; }
      const ys = I.filter(y => y !== w && !dicho(y) && relevable(y)).sort((a, b) => ((c2.indexOf(b) >= 0 ? 1 : 0) - (c2.indexOf(a) >= 0 ? 1 : 0)) || orden(a, b));

      else if (!decl.some(d => !d.publica && d.tipo === 'NOT' && d.sujeto === X) && relevable(X)) relevo(w, X, 'NOT');

      if (!quedan.length) break;
      const y = quedan.find(z => relevable(z) && !dicho(z));

    if (!decl.some(d => d.tipo === 'SENALA')) {
      for (const w of I) {
        if (datos[w].length !== 1 || w === sujetoSenala) continue;
        const d = datos[w][0];
        quitar(d);
        const sigue = candidatos(C, reparto, decl, 3, T);
        const pub = candidatos(C, reparto, decl.filter(z => z.publica), 3, T);
        if (sigue.length === 1 && sigue[0] === X && (!cebo || pub.indexOf(cebo) >= 0)) {

      if (r3.length !== 1 || r3[0] !== X) return null;
      if (cebo && pub.indexOf(cebo) < 0) return null;
      if (I.some(w => !datos[w].length)) return null;
      if (!decl.some(d => d.tipo === 'SENALA')) return null;

  }

  // Elige la prueba (entre las señas del culpable) y el cebo, y genera las pistas. Devuelve
  // { decl, prueba, pruebaIdx, cebo }.
  function generarDeclaraciones(C, reparto, X, v) {
    const T = v.hora;
    const I = reparto.filter(c => c !== X).sort(porN(C));
    const pref = c => { const l = lugarDe(C, c, T); return l === 'H' || l === 'J' ? 0 : l === 'V' ? 1 : 2; };
    const ops = pruebasDe(v);
    let mejor = null;
    for (let ip = 0; ip < ops.length; ip++) {
      const K = ops[ip].sena;
      const cebos = I.filter(c => tieneSena(C, c, K)).sort((a, b) => pref(a) - pref(b) || P(C, a).n - P(C, b).n);
      for (const cebo of cebos) {
        const decl = construirPistas(C, reparto, X, T, K, cebo, false) || construirPistas(C, reparto, X, T, K, cebo, false, true);
        if (!decl) continue;
        // Se prefiere la opción que da a cada inocente un solo dato privado (papeles de la misma longitud)
        const porTestigo = {};
        for (const d of decl) if (!d.publica) porTestigo[d.fuente] = (porTestigo[d.fuente] || 0) + (d.tipo === 'VISTA' ? (d.vio.length ? 1 : 0) + d.noVio.length : 1);
        const nota = Math.max(0, ...Object.values(porTestigo)) * 100 + (decl.cadena ? 0 : 50) + ip * 10 + pref(cebo);
        if (!mejor || nota < mejor.nota) mejor = { decl, prueba: K, pruebaIdx: ip, cebo, nota };

    return { decl: construirPistas(C, reparto, X, T, ops[0].sena, null, true), prueba: ops[0].sena, pruebaIdx: 0, cebo: null };
  }

  // ---------- Partida ----------
  // tardes: { idPersonaje: idTarde } (opcional; por defecto, la primera de cada uno). La del culpable es siempre
  // la de su variante.
  function armarPartida(C, semilla, asientos, culpable, v, tardes) {
    const B = base(C), t = {};

    t[culpable] = tardeDeVariante(B, v);
    const g = generarDeclaraciones(vista(B, t), asientos, culpable, v);
    return {
      semilla, n: asientos.length, asientos, culpable, variante: v.id, tardes: t, hora: v.hora, prueba: g.prueba, pruebaIdx: g.pruebaIdx, cebo: g.cebo,

  // Garantías de una partida (las comprueba también, con un solver aparte, tools/verificar-misterio-rapido.js):
  // tras la ronda 3 queda un único sospechoso y es el culpable; tras la ronda 2, al menos 3; y hay cebo (un
  // inocente sin coartada tras la ronda 2 que encaja con la prueba, descartado solo con lo que dicen los móviles).
  function cumpleGarantias(C, partida) {

    return r3.length === 1 && r3[0] === partida.culpable && r2.length >= 3 && !!partida.cebo && r2.indexOf(partida.cebo) >= 0;
  }
  // El sorteo de la semilla: reparto, culpable (con el mismo azar que la v2.1), la tarde de cada jugador (con
  // otro azar, para que el contenido de una sola tarde dé las mismas partidas que antes) y la variante.
  function sortearTardes(C, ids, r) { const t = {}; for (const id of ids) { const ts = tardesDe(C, id); t[id] = ts[Math.floor(r() * ts.length)]; } return t; }
  function sorteo(C, semilla, n) {
    const r = azar(mezcla(semilla, n, 0x4d43));
    const posibles = C.variantes.map(v => v.culpable);
    let asientos = null;
    for (let i = 0; i < 200; i++) {
      asientos = barajar(C.personajes.map(p => p.id), r).slice(0, n);
      if (asientos.some(id => posibles.indexOf(id) >= 0)) break;
    }
    const cand = asientos.filter(id => posibles.indexOf(id) >= 0);
    const culpable = cand[Math.floor(r() * cand.length)];
    const tardes = sortearTardes(C, asientos, azar(mezcla(semilla, n, 0x7a2d)));
    // La tarde del culpable tiene que tener historia de culpable (si no, otra de las suyas que la tenga)
    const conHistoria = tardesDe(C, culpable).filter(t => variantesDeTarde(C, culpable, t).length);
    if (conHistoria.indexOf(tardes[culpable]) < 0) tardes[culpable] = conHistoria[mezcla(semilla, n, 0x7a2f) % conHistoria.length];
    const vs = variantesDeTarde(C, culpable, tardes[culpable]);

  const MAX_RESORTEOS = 24;
  function crearPartida(C, semilla, n) {

    C = base(C);
    const s = sorteo(C, semilla, n);
    const primera = armarPartida(C, semilla, s.asientos, s.culpable, s.v, s.tardes);
    if (cumpleGarantias(C, primera)) return primera;
    // Re-sorteo determinista de las tardes de los inocentes (la del culpable y su historia no cambian)
    const otros = s.asientos.filter(id => id !== s.culpable);
    const probar = t => { t[s.culpable] = s.tardes[s.culpable]; const p = armarPartida(C, semilla, s.asientos, s.culpable, s.v, t); return cumpleGarantias(C, p) ? p : null; };
    for (let k = 1; k <= MAX_RESORTEOS; k++) { const p = probar(sortearTardes(C, otros, azar(mezcla(semilla, n, k, 0x7a4e)))); if (p) { p.resorteo = k; return p; } }
    // Si ningún sorteo vale, se recorren todas las combinaciones (en un orden fijo que depende de la semilla)
    const listas = otros.map(id => tardesDe(C, id));
    const total = listas.reduce((a, l) => a * l.length, 1), inicio = mezcla(semilla, n, 0x7a50) % total;
    for (let k = 0; k < total; k++) {

      const p = probar(t); if (p) { p.resorteo = MAX_RESORTEOS + 1 + k; return p; }
    }

  }
  const varianteDe = (C, partida) => base(C).variantes.find(v => v.id === partida.variante);
  const pruebaDe = (C, partida) => pruebasDe(varianteDe(C, partida))[partida.pruebaIdx || 0];

  // «Otra partida» con el mismo grupo (escaneando en el mismo orden). Recuerda TODA la sesión.
  // v3 (tardes, E1). Reglas fijas (se descarta la semilla que no las cumple):
  //  - el culpable es otra persona (otro asiento) hasta que hayan sido culpables los n jugadores; al empezar
  //    un ciclo nuevo, tampoco repite la persona de la última partida;
  //  - la historia del culpable (su variante) no es la de la partida anterior.
  // Preferencias, por este orden (de entre las semillas que cumplen lo anterior):
  //  1. el culpable de la partida anterior no vuelve a la mesa (con 4-7 jugadores siempre se puede; con 8
  //     están todos: vuelve, con otra tarde si la tiene, y puede ser culpable con otra historia);
  //  2. el mínimo de personajes repetidos respecto de la partida anterior (con 8 personajes: 4 jugadores → 0,
  //     5 → 2, 6 → 4, 7 → 6, 8 → 8);
  //  3. que nadie de la mesa traiga una tarde cuya historia de culpable ya salió en la sesión («gastada»;
  //     pesa más cuanto más reciente). Así no se repite la historia del culpable y nadie queda descartado
  //     por el historial; si no se puede evitar, quien la trae puede ser culpable otra vez (repite historia);
  //  4. que nadie repita una pareja (personaje, tarde) ya jugada en la sesión, hasta agotar las tardes de
  //     ese personaje;
  //  5. que nadie juegue un personaje que ya jugó en las dos partidas anteriores.
  // Ninguna preferencia mira quién es el culpable dentro de la mesa: entre nuevos y repetidos (y entre tardes),
  // el culpable sale en la misma proporción que hay de cada uno (tools/verificar-misterio-rapido.js lo mide).
  // Con contenido de una sola tarde por personaje equivale a la v2 (fase 2d).
  // Solo lo calcula el móvil del anfitrión, que guarda las semillas de la sesión; no muestra nada.
  // Caché de partidas solo para «Otra partida» (no sale de aquí: nadie modifica estas partidas)
  const CACHE_SS = typeof WeakMap !== 'undefined' ? new WeakMap() : null;
  function partidaCache(C, s, n) {
    if (!CACHE_SS) return crearPartida(C, s, n);
    let m = CACHE_SS.get(C); if (!m || m.size > 20000) CACHE_SS.set(C, (m = new Map()));
    const k = s * 8 + n; let p = m.get(k); if (!p) m.set(k, (p = crearPartida(C, s, n))); return p;
  }
  function semillaSiguiente(C, historial, n) {
    C = base(C);
    const semillas = Array.isArray(historial) ? historial : [historial];
    const hist = semillas.map(s => partidaCache(C, s, n)), semUlt = semillas[semillas.length - 1];
    const ultimo = hist[hist.length - 1], previo = hist.length > 1 ? hist[hist.length - 2] : null;
    let asientos = [];
    for (const p of hist) { if (asientos.length >= n) asientos = []; asientos.push(p.asientos.indexOf(p.culpable)); }
    const prohibeA = asientos.length >= n ? [ultimo.asientos.indexOf(ultimo.culpable)] : asientos;
    // Historias ya contadas (en ciclo: cuando han salido todas, se empieza de nuevo) y su peso por recencia
    let usadas = []; const pesoV = {};
    hist.forEach((p, i) => { if (usadas.length >= C.variantes.length) usadas = []; usadas.push(p.variante); pesoV[p.variante] = 1 / (hist.length - i); });
    const gastada = (id, t) => { const vs = variantesDeTarde(C, id, t); return vs.length && vs.every(v => usadas.indexOf(v.id) >= 0) ? Math.max(...vs.map(v => pesoV[v.id] || 0)) : 0; };
    // Parejas (personaje, tarde) ya jugadas, en ciclo por personaje
    const jugadas = {};
    for (const p of hist) for (const id of p.asientos) { const tot = tardesDe(C, id).length; if (!jugadas[id] || jugadas[id].length >= tot) jugadas[id] = []; jugadas[id].push(p.tardes[id]); }
    // (con una sola tarde no hay otra que traer: no cuenta como repetida)
    const repetida = (id, t) => { const u = jugadas[id], tot = tardesDe(C, id).length; if (!u || tot < 2) return 0; return (u.length >= tot ? u[u.length - 1] === t : u.indexOf(t) >= 0) ? 1 : 0; };
    const total = C.personajes.length, minSolape = Math.max(0, 2 * n - total);
    // Lo mejor que se puede conseguir (para parar en cuanto se encuentre): fuera de la mesa anterior, todos; de
    // la mesa anterior, los que menos pesan; cada uno con su mejor tarde
    const mejorT = (id, f) => Math.min(...tardesDe(C, id).map(t => f(id, t)));
    const fuera = C.personajes.map(p => p.id).filter(id => ultimo.asientos.indexOf(id) < 0);
    const resto = ultimo.asientos.slice().sort((a, b) => ((a === ultimo.culpable) - (b === ultimo.culpable)) || (mejorT(a, gastada) - mejorT(b, gastada)) || (mejorT(a, repetida) - mejorT(b, repetida)));
    const idealSet = fuera.concat(resto).slice(0, n);
    const ideal1 = idealSet.indexOf(ultimo.culpable) >= 0 ? 1 : 0;
    const ideal3 = Math.round(100 * idealSet.reduce((a, id) => a + mejorT(id, gastada), 0)), idealP = idealSet.reduce((a, id) => a + mejorT(id, repetida), 0);
    const notaDe = p => {
      const k1 = p.asientos.indexOf(ultimo.culpable) >= 0 ? 1 : 0;
      const k2 = p.asientos.filter(id => ultimo.asientos.indexOf(id) >= 0).length - minSolape;
      const k3 = Math.round(100 * p.asientos.reduce((a, id) => a + gastada(id, p.tardes[id]), 0));
      const kp = p.asientos.reduce((a, id) => a + repetida(id, p.tardes[id]), 0);
      const k4 = p.asientos.filter((id, k) => id === ultimo.asientos[k] || (previo && id === previo.asientos[k])).length;
      return { nota: (((k1 * 100 + k2) * 10000 + k3) * 100 + kp) * 100 + k4, ideal: k1 === ideal1 && k2 === 0 && k3 <= ideal3 && kp <= idealP && k4 === 0 };
    };
    let mejor = null, mejorNota = Infinity, reserva = null;
    for (let i = 1; i < 30000; i++) {
      const s = mezcla(semUlt, hist.length, i, 0x51) % MAX_SEMILLA;
      // Primero, sin generar las pistas (más rápido): reparto, culpable, su historia y la primera tirada de tardes
      const p = repartoDe(C, s, n);
      if (prohibeA.indexOf(p.asientos.indexOf(p.culpable)) >= 0) continue;
      if (reserva === null) reserva = s;
      if (p.variante === ultimo.variante) continue;
      if (notaDe(p).nota >= mejorNota) continue;
      // Si mejora, con las tardes definitivas (la partida puede haber re-sorteado las de los inocentes)
      const q = notaDe(partidaCache(C, s, n));
      if (q.nota < mejorNota) { mejor = s; mejorNota = q.nota; }
      if (q.ideal) break;
    }
    return mejor !== null ? mejor : reserva !== null ? reserva : nuevaSemilla();
  }
  // Versión anterior (v1, fase 2): se conserva solo para que la verificación mida el antes y el después
  function semillaSiguienteV1(C, historial, n) {
    const hist = (Array.isArray(historial) ? historial : [historial]).map(s => crearPartida(C, s, n));
    const ultimo = hist[hist.length - 1];
    const totalPj = C.variantes.map(v => v.culpable).filter((x, i, a) => a.indexOf(x) === i).length;
    let asientos = [], pjs = [];
    for (const p of hist) {
      if (asientos.length >= n) asientos = [];
      asientos.push(p.asientos.indexOf(p.culpable));
      if (pjs.length >= Math.min(totalPj, n)) pjs = [];
      pjs.push(p.culpable);
    }
    const prohibeA = asientos.length >= n ? [ultimo.asientos.indexOf(ultimo.culpable)] : asientos;
    const prohibeP = pjs.length >= Math.min(totalPj, n) ? [ultimo.culpable] : pjs;
    let nivel1 = null, nivel2 = null;
    for (let i = 1; i < 30000; i++) {
      const s = mezcla(ultimo.semilla, hist.length, i, 0x51) % MAX_SEMILLA;
      // Solo hace falta el reparto y el culpable: se calcula sin generar las pistas (más rápido)
      const p = repartoDe(C, s, n);
      if (prohibeA.indexOf(p.asientos.indexOf(p.culpable)) >= 0) continue;
      if (nivel2 === null) nivel2 = s;
      if (prohibeP.indexOf(p.culpable) >= 0) continue;
      if (nivel1 === null) nivel1 = s;
      if (p.asientos.every((id, k) => id !== ultimo.asientos[k])) return s;
    }
    return nivel1 !== null ? nivel1 : nivel2 !== null ? nivel2 : nuevaSemilla();
  }
  // Reparto, culpable y variante de una semilla sin generar las pistas. «tardes» es la primera tirada: la del
  // culpable es la definitiva; las de los inocentes pueden cambiar si crearPartida tiene que re-sortear.
  function repartoDe(C, semilla, n) {
    const s = sorteo(base(C), semilla, n);
    return { asientos: s.asientos, culpable: s.culpable, variante: s.v.id, tardes: s.tardes };
  }

  // ---------- Textos ----------
  // Todas las pantallas privadas tienen la MISMA estructura para inocentes y culpable, ronda a ronda:
  //   situación (lo nuevo) + kit { decir: 2 frases para decir en voz alta, pregunta: {q, a}, jugada }.
  // tools/verificar-misterio-rapido.js comprueba que la longitud no difiere más de un 10 % en la misma ronda.
  const otroAsiento = (partida, asiento, k) => partida.asientos[(asiento - 1 + k) % partida.n];
  function elegir(partida, asiento, ids) {
    for (let k = 1; k <= partida.n; k++) { const x = otroAsiento(partida, asiento, k); if (ids.indexOf(x) >= 0) return x; }
    return null;
  }
  function ctx(C, partida, asiento, g) {
    C = deP(C, partida);
    const id = partida.asientos[asiento - 1];
    const p = P(C, id);
    const nombre = p.nombres[g] || p.nombres.M;
    const h = partida.hora;
    const t = s => genero(rellenar(s, { s: nombre, h }), g);
    const l = lugarDe(C, id, h);
    return {
      id, p, nombre, h, t, v: varianteDe(C, partida), culpable: id === partida.culpable, ap: x => P(C, x).apellido,
      lugar: l === 'H' ? C.lugares.H.tu : nombreLugar(C, l, h), lugarYo: l === 'H' ? C.lugares.H.yo : nombreLugar(C, l, h), codLugar: l,
      sena: C.senas[partida.prueba], c2: candidatos(C, partida.asientos, partida.declaraciones, 2, h),
    };
  }
  const comillas = s => '«' + s + '»';
  // Frase con la voz del personaje (si la tiene) o la común
  const vz = (C, p, k) => (p.voz && p.voz[k]) || C.textos[k];
  const conComa = q => q + (q.indexOf(',') >= 0 ? ',' : '');

  function tarjeta(C, partida, asiento, g) {
    C = deP(C, partida);
    const x = ctx(C, partida, asiento, g);
    const { p, t, v } = x;
    const kit = x.culpable
      ? { decir: v.kit.r1.decir.map(s => comillas(t(s))), pregunta: { q: t(v.kit.r1.q), a: comillas(t(v.kit.r1.a)) } }
      : { decir: p.decirR1.map(s => comillas(t(s))), pregunta: { q: t(p.preguntaR1.q), a: comillas(t(p.preguntaR1.a)) } };
    // Sin nombres: en la ronda 1 todavía no se han presentado
    kit.jugada = x.culpable ? rellenar(C.textos.r1JugadaCulpable, { h: x.h }) : (p.voz && p.voz.r1Jugada) || C.textos.r1JugadaInocente;
    return {
      id: x.id, tarde: p.tarde, nombre: x.nombre, apellido: p.apellido,
      presentacion: t(p.presentacion), secreto: t(p.secreto), relacion: t(p.relacion),
      coartada: C.momentos.map(h => ({ hora: h, texto: t(p.detalle[h]) })),
      senas: p.senas.map(s => C.senas[s].tuya),
      papel: x.culpable
        ? { culpable: true, titulo: C.textos.culpableTitulo, texto: [t(v.loQuePaso), t(v.version) + ' ' + t(C.textos.culpableCierre)] }
        // v2: el inocente lleva también «no lo inventes» (así «Tu papel» mide lo mismo para todos)
        : { culpable: false, titulo: C.textos.inocenteTitulo, texto: [t(p.tuTarde), t(C.textos.inocente) + ' ' + t(C.textos.reglaInventar)] },
      kit,
    };
  }

  function textoDeclaracion(C, d) {
    if (d.texto) return d.texto;
    if (d.tipo === 'PENDIENTE') return rellenar(fx(C, 'pendiente'), { quien: conComa(d.quien) });
    const s = P(C, d.sujeto).apellido;
    if (d.tipo === 'PARCIAL') return rellenar(d.clase === 'documento' ? C.lugares[d.lugar].documento.parcial : C.lugares[d.lugar].personal.parcial, { h: d.hora, s });
    if (d.clase === 'relevo') { const t = rellenar(d.tipo === 'NOT' ? C.textos.datoRelevoNo : C.textos.datoRelevoSi, { quien: conComa(d.quien), h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) }); return t.charAt(0).toUpperCase() + t.slice(1); }
    if (d.tipo === 'NOT') return rellenar(fx(C, 'declNo'), { quien: d.quien, h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) });
    return rellenar(fx(C, 'declSi'), { quien: d.quien, h: d.hora, s, lugar: nombreLugar(C, d.lugar, d.hora) });
  }

  // Declaraciones públicas de una ronda, agrupando las del personal («Ercole: vio a A y B en la terraza»).
  function declaracionesPublicas(C, partida, ronda) {
    C = deP(C, partida);
    const ds = partida.declaraciones.filter(d => d.publica && d.ronda === ronda && d.tipo !== 'PRUEBA');
    const out = [];
    const grupos = {};
    for (const d of ds) {
      if (d.clase === 'personal' && d.tipo === 'CONF') {
        const k = d.quien + '|' + d.lugar;
        if (!grupos[k]) { grupos[k] = { d, sujetos: [] }; out.push(grupos[k]); }
        grupos[k].sujetos.push(P(C, d.sujeto).apellido);
      } else out.push({ texto: textoDeclaracion(C, d) });
    }
    return out.map(x => (x.texto ? x.texto : rellenar(fx(C, 'declSi'), { quien: x.d.quien, h: x.d.hora, s: lista(x.sujetos, C), lugar: nombreLugar(C, x.d.lugar, x.d.hora) })));
  }

  function publico(C, partida, ronda) {
    C = deP(C, partida);
    const v = varianteDe(C, partida);
    const T = C.textos, h = partida.hora;
    if (ronda === 1) return { titulo: fx(C, 'tituloR1'), parrafos: T.r1Publico.slice(), regla: T.regla, instruccion: T.r1Instruccion, declaraciones: [] };
    if (ronda === 2) {
      const decl = declaracionesPublicas(C, partida, 2);
      for (const id of partida.asientos) { const l = C.lugares[lugarDe(C, id, h)]; if (l.notaR2 && l.documento && l.documento.horas.indexOf(h) >= 0 && decl.indexOf(l.notaR2) < 0) decl.push(l.notaR2); }
      return { titulo: fx(C, 'tituloR2'), parrafos: [v.textoHora], declaraciones: decl, cierre: rellenar(T.r2Cierre, { h }) };
    }
    if (ronda === 3) {
      const decl = declaracionesPublicas(C, partida, 3);
      return { titulo: fx(C, 'tituloR3'), parrafos: [pruebaDe(C, partida).texto], declaraciones: decl.length ? decl : [fx(C, 'nadieMas')], cierre: rellenar(T.r3Cierre, { h }) };
    }
    return { titulo: fx(C, 'tituloVoto'), parrafos: [T.voto], declaraciones: [] };
  }

  // El dato privado de un inocente, en una frase
  // corto = forma breve, para quien tiene más de un dato (así todos los papeles miden lo mismo)
  function fraseDato(C, partida, d, corto) {
    const ap = x => P(C, x).apellido, T = C.textos;
    if (d.tipo === 'VISTA') {
      const f = [];
      if (d.vio.length) f.push(rellenar(corto ? T.datoVioCorto : T.datoVio, { lista: lista(d.vio.map(ap), C) }));
      for (const x of d.noVio) f.push(rellenar(corto ? T.datoNoVioCorto : T.datoNoVio, { s: ap(x) }));
      return f.join(' ');
    }
    if (d.tipo === 'SENALA') return rellenar(corto ? T.datoSenalaCorto : T.datoSenala, { s: ap(d.sujeto), gesto: C.senas[d.sena].gesto });
    if (corto && d.clase === 'relevo') return rellenar(d.tipo === 'NOT' ? T.datoRelevoNoCorto : T.datoRelevoSiCorto, { quien: conComa(d.quien), s: ap(d.sujeto), lugar: nombreLugar(C, d.lugar, d.hora) });
    return textoDeclaracion(C, d);
  }

  function privado(C, partida, asiento, g, ronda) {
    C = deP(C, partida);
    const x = ctx(C, partida, asiento, g);
    const { p, t, v, h, ap } = x;
    const T = C.textos;
    const r = s => t(rellenar(s, { h, lugar: x.lugar, lugarYo: x.lugarYo }));
    if (ronda === 2) {
      const Z = otroAsiento(partida, asiento, 1);
      const situacion = [rellenar(fx(C, 'secretoDe'), { s: ap(Z), rumor: P(C, Z).rumor })];
      const Y = elegir(partida, asiento, x.c2.filter(z => z !== x.id));
      const q = r(T.r2Pregunta);
      if (x.culpable) {
        situacion.push(r(T.r2Culpable));
        return { situacion, kit: { decir: v.kit.r2.decir.map(s => comillas(r(s))), pregunta: { q, a: comillas(r(v.kit.r2.a)) }, jugada: rellenar(vz(C, p, 'r2Jugada'), { s: ap(Y), h }) } };
      }
      const conf = partida.declaraciones.find(d => d.tipo === 'CONF' && d.ronda === 2 && d.publica && d.sujeto === x.id);
      const pend = partida.declaraciones.find(d => d.tipo === 'PENDIENTE' && d.lugar === x.codLugar);
      const estado = conf ? rellenar(T.r2Confirmado, { quien: conComa(conf.quien) }) : pend ? rellenar(T.r2Pendiente, { quien: conComa(pend.quien) }) : T.r2SinTestigo;
      const resp = conf ? rellenar(vz(C, p, 'r2RespConfirmado'), { quien: conf.quien }) : pend ? rellenar(vz(C, p, 'r2RespPendiente'), { quien: pend.quien.split(',')[0] }) : vz(C, p, 'r2RespSinTestigo');
      situacion.push(r(T.r2Inocente) + ' ' + estado);
      return { situacion, kit: { decir: [comillas(r(vz(C, p, 'r2Decir'))), rellenar(fx(C, 'defenderSecreto'), { frase: comillas(t(p.defensaSecreto)) })], pregunta: { q, a: comillas(r(resp)) }, jugada: rellenar(vz(C, p, 'r2Jugada'), { s: ap(Y), h }) } };
    }
    if (ronda === 3) {
      const K = partida.prueba, sena = x.sena, pr = pruebaDe(C, partida);
      const q = rellenar(fx(C, 'preguntaSena'), { sena: sena.preguntaTu });
      if (x.culpable) {
        const amenaza = partida.declaraciones.find(d => !d.publica && ((d.tipo === 'NOT' && d.sujeto === x.id) || (d.tipo === 'VISTA' && d.noVio.indexOf(x.id) >= 0)));
        const cebo = partida.cebo || elegir(partida, asiento, x.c2.filter(z => z !== x.id));
        const s2 = rellenar(T.r3CulpableCebo, { s: ap(cebo) }) + ' ' + (amenaza ? rellenar(T.r3Amenaza, { s: ap(amenaza.fuente) }) : T.r3SinAmenaza); // misma longitud con o sin amenaza
        const despeja = partida.declaraciones.find(d => !d.publica && d.tipo === 'CONF' && d.sujeto === cebo);
        const vista = partida.declaraciones.find(d => d.tipo === 'VISTA' && d.vio.indexOf(cebo) >= 0);
        const jugada = despeja ? rellenar(T.r3Duda, { s: ap(cebo), quien: despeja.quien, duda: despeja.duda }) : vista ? rellenar(T.r3DudaVista, { s: ap(cebo) }) : T.r3DudaNadie;
        return { situacion: [r(T.r3Culpable), s2], kit: { decir: [comillas(r(v.kit.r3.decir)), comillas(r(pr.decir))], pregunta: { q, a: comillas(r(pr.a)) }, jugada } };
      }
      const mios = partida.declaraciones.filter(d => !d.publica && d.fuente === x.id);
      const nDatos = mios.reduce((n, d) => n + (d.tipo === 'VISTA' ? (d.vio.length ? 1 : 0) + d.noVio.length : 1), 0);
      const frasesDatos = mios.map(d => fraseDato(C, partida, d, nDatos > 1)).join(' ');
      // Todos los inocentes llevan el recordatorio «no me fijé»; quien tiene dos datos los recibe en forma breve
      // (así todos los papeles miden lo mismo)
      const situacion = [r(T.r3Lugar), frasesDatos + ' ' + T.r3Recuerda];
      const tiene = tieneSena(C, x.id, K);
      const decir = [comillas(r(vz(C, p, 'r3DecirLugar'))), comillas(tiene ? rellenar(vz(C, p, 'r3DecirConSena'), { admite: sena.admite }) : rellenar(vz(C, p, 'r3DecirSinSena'), { yoNo: sena.yoNo }))];
      const a = comillas(r(tiene ? vz(C, p, 'r3RespConSena') : vz(C, p, 'r3RespSinSena')));
      // La jugada sale del dato más fuerte: quien miente > quien queda descartado
      const no = mios.find(d => (d.tipo === 'VISTA' && d.noVio.length) || d.tipo === 'NOT');
      const si = mios.find(d => d.tipo === 'CONF') ;
      const vista = mios.find(d => d.tipo === 'VISTA' && d.vio.length);
      let jugada;
      if (no && no.tipo === 'VISTA') jugada = rellenar(vz(C, p, 'r3JugadaAcusa'), { s: ap(no.noVio[0]), lugar: x.lugar, h });
      else if (no) jugada = rellenar(T.r3JugadaCuentaNo, { s: ap(no.sujeto), lugar: nombreLugar(C, no.lugar, h), h });
      else if (si) jugada = rellenar(T.r3JugadaCuenta, { s: ap(si.sujeto), lugar: nombreLugar(C, si.lugar, h), h });
      else if (vista) jugada = rellenar(T.r3JugadaCuentaVio, { lista: lista(vista.vio.map(ap), C), h });
      else { const sn = mios.find(d => d.tipo === 'SENALA'); jugada = rellenar(T.r3JugadaSenala, { s: ap(sn.sujeto) }); } // el gesto ya está en la situación: no se repite
      return { situacion, kit: { decir, pregunta: { q, a }, jugada } };
    }
    return { situacion: [], kit: null };
  }

  // Lo que enseña la pestaña «Ahora» de la mini web en cada ronda (v2, fase 2d). Las mismas piezas para
  // todos, culpable incluido (la verificación compara su forma y su longitud):
  //  privado: lo que solo sabe ese jugador; cada pieza con su clave y, si toca, una etiqueta
  //           (guarda = tu secreto, no lo cuentes salvo que te lo pregunten; cuenta = lo cuentas en tu turno;
  //           usa = para usar en tu turno, la neutra de la ronda 3);
  //  turno:   lo que dice en su turno: una frase (kit.decir[0]) y, en la ronda 1, dónde dice que estaba;
  //  ayuda:   lo que va plegado detrás de «Más ayuda»: la otra frase, la pregunta probable y la jugada.
  // No añade texto nuevo del caso: reordena lo que ya dan tarjeta() y privado().
  function pantalla(C, partida, asiento, g, ronda) {
    C = deP(C, partida);
    const x = ctx(C, partida, asiento, g);
    if (ronda === 1) {
      const tj = tarjeta(C, partida, asiento, g);
      const fila = cuaderno(C, partida).find(f => f.id === x.id);
      return {
        privado: [
          // Una línea de la misma longitud para inocentes y culpable (el papel completo está en «Mi personaje»)
