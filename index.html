<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#11161d">
<title>Uno di Voi · El último fallo · partida rápida</title>
<style>
:root{--fondo:#11161d;--panel:#1a212b;--borde:#2c3644;--texto:#ece6d8;--suave:#a7adb6;--oro:#d9a441;--hortensia:#8fa9dc;--papel:#f4ecd8;--tinta:#2a2118;--mal:#e3826f;--ok:#7cc79a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);background-image:radial-gradient(circle at 50% -20%,#22324a 0,transparent 60%);color:var(--texto);font:18px/1.5 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:12px 16px 56px}
.cab{text-align:center;border-bottom:1px solid var(--borde);padding:6px 0 10px;margin-bottom:12px}
.hotel{margin:0;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--oro)}
.marca{margin:2px 0 0;font-size:.85rem;color:var(--suave);font-style:italic}.marca span{font-style:normal}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;line-height:1.2}
.titulo{font-size:1.75rem;margin:.3em 0 .2em}.sub{color:var(--suave);margin-top:0}
.nombre{font-size:1.9rem;margin:.2em 0 .4em;color:var(--oro)}
h2{font-size:1.25rem;color:var(--oro);margin:.2em 0 .5em}h3{font-size:1rem;margin:1em 0 .3em;color:var(--hortensia);text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--panel);border:1px solid var(--borde);border-radius:12px;padding:12px 16px;margin:12px 0}
.carta{background:var(--papel);color:var(--tinta);border-radius:6px;padding:14px 16px;margin:12px 0;box-shadow:0 2px 0 #b9a77f,0 6px 18px rgba(0,0,0,.35);border:1px solid #d8c9a3}
.carta h3{color:#6b4f1d}.carta summary{color:#6b4f1d}
.carta.nueva{border-left:6px solid var(--oro)}
.etq{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin:0 0 6px}
.carta .etq{color:#8a6420}
summary{cursor:pointer;font-weight:bold;color:var(--oro);padding:2px 0;list-style-position:outside}
details .cuerpo{margin-top:8px}
button{display:block;width:100%;font:inherit;font-weight:bold;margin:10px 0;padding:14px;border-radius:12px;border:0;background:var(--oro);color:#1c1406;cursor:pointer;min-height:52px}
button.sec{background:transparent;color:var(--texto);border:1px solid var(--borde);font-weight:normal}
button.grande{font-size:1.15rem;background:var(--papel);color:var(--tinta)}
button.pequeno{min-height:40px;padding:8px;font-size:.9rem}
.numeros{display:flex;gap:8px;flex-wrap:wrap}.numeros button{flex:1;min-width:52px;font-size:1.3rem}
input[type=text]{width:100%;font:inherit;font-size:1.3rem;padding:12px;border-radius:10px;border:1px solid var(--borde);background:#0c1015;color:var(--texto);letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.codigo input{text-align:center;font-size:1.8rem;letter-spacing:.4em}
.error{color:var(--mal);min-height:1.3em;font-size:.95rem;margin-top:6px}
.nota{color:var(--suave);font-size:.88rem}
.carta .nota{color:#6d6250}
.como ol{padding-left:1.2em;margin:0}.como li{margin:.35em 0}
.chip{display:inline-block;background:#24324a;color:var(--hortensia);border:1px solid #34486a;border-radius:999px;padding:3px 12px;font-size:.85rem;letter-spacing:.05em;margin:4px 0}
.fila-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mesa{font-size:.75rem;color:var(--suave);letter-spacing:.08em;margin-left:auto}
/* v2 (fase 2d): barra fija de abajo con 3 pestañas y «Tapar»; no tapa el código ni los botones (main deja sitio) */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(12,16,21,.97);border-top:1px solid var(--borde);box-shadow:0 -6px 18px rgba(0,0,0,.55);max-width:560px;margin:0 auto}
.barra button{flex:1 1 0;margin:0;min-height:52px;padding:6px 2px;font-size:.82rem;line-height:1.15;border-radius:10px;background:transparent;color:var(--suave);border:1px solid var(--borde);font-weight:normal}
.barra button.activa{color:var(--oro);border-color:var(--oro);background:var(--panel);font-weight:bold}
.barra .tapar-fijo{flex:0 0 22%;background:#0c1015;color:var(--oro);border:2px solid var(--oro);font-weight:bold;letter-spacing:.03em}
main{padding-bottom:76px}.juego .carta,.juego .turno{margin:10px 0}
.juego .marca{display:none}.juego .nombre{font-size:1.6rem;margin:.1em 0 .3em}.juego .cab{padding:2px 0 6px;margin-bottom:6px}.hotel{letter-spacing:.1em;font-size:.66rem}
.horas-linea{margin:2px 0 6px;font-size:.95rem}.horas-linea b{color:var(--oro)}.horas-linea span{white-space:nowrap}
.fila-codigo{display:flex;gap:8px;align-items:stretch}.fila-codigo input{flex:1 1 40%;margin:6px 0 0;min-width:0}.fila-codigo button{flex:1 1 60%;margin:6px 0 0;padding:8px}
.codigo label{display:block;font-size:.95rem}.codigo .error{min-height:0}
.mas .regla-inventar{font-size:.9rem;margin:10px 0 0}
.fila-cab .ayuda-btn{width:auto;min-height:36px;margin:0 0 0 8px;padding:2px 13px;border-radius:999px;background:transparent;color:var(--oro);border:1px solid var(--oro);font-size:1rem}
.selector{display:flex;align-items:center;gap:6px;margin:2px 0 6px;font-size:.85rem;color:var(--suave)}.selector span{margin-right:2px}
.selector .pill{width:auto;flex:1;margin:0;min-height:40px;padding:4px 6px;border-radius:999px;background:transparent;color:var(--texto);border:1px solid var(--borde);font-weight:normal;font-size:.9rem}
.selector .pill.activa{background:var(--oro);color:#1c1406;border-color:var(--oro);font-weight:bold}.selector .pill:disabled{opacity:.35;cursor:default}
.banda{background:var(--oro);color:#1c1406;border-radius:10px;padding:8px 14px;margin:6px 0 10px}.banda p{margin:0}.banda .banda-t{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:bold;opacity:.8}
.banda.pasada{background:var(--panel);color:var(--texto);border:1px dashed var(--suave)}.banda.pasada button{margin:8px 0 0}
.privada{padding-top:10px}.privada .pieza+.pieza{border-top:1px dashed #cdbd95;margin-top:8px;padding-top:2px}.privada .pieza p{margin:.35em 0}.privada h3{margin:.5em 0 .1em}
.et-privado::before{content:"\1F512  "}.et-turno::before{content:"\1F4AC  "}
.sello{display:inline-block;margin:2px 0 4px;padding:2px 8px;border-radius:999px;font-size:.76rem;font-weight:bold;letter-spacing:0}
.sello-guarda{background:#7a2e22;color:#fbe9e4}.sello-cuenta,.sello-usa{background:#2f5d43;color:#e6f6ec}
/* v2.1: línea «Y cuenta también lo que sabes», cuaderno con nombres que se tachan, aviso del anfitrión, revelación corta */
.turno .cuenta-tambien{margin:2px 0 4px;font-size:.92rem;font-weight:bold;color:var(--hortensia)}
.tablero .nombre-fila{display:block;width:100%;margin:0;padding:2px 0;min-height:0;text-align:left;background:transparent;color:var(--texto);border:0;border-radius:4px;font-weight:bold;font-size:.95rem}
.tablero tr.tachada .nombre-fila{text-decoration:line-through;color:var(--suave)}.tablero tr.tachada small,.tablero tr.tachada .celda{opacity:.35}
.tablero .fuera{display:inline-block;margin-left:4px;font-size:.7rem;font-weight:normal;font-style:italic;text-decoration:none;color:var(--hortensia)}
.aviso-juegas{border-left:4px solid var(--hortensia);padding:4px 10px;margin:6px 0;font-size:.9rem;color:var(--texto)}
.revelacion-corta .fue{font-size:2.2rem;margin:.1em 0 .3em}.revelacion-corta .esencial{font-size:1.1rem}
.carta button.sec{color:var(--tinta);border-color:#b9a77f;background:#efe4c8}.carta button.pequeno{min-height:36px;padding:6px;margin:8px 0 2px}.juego .chip{margin:2px 0}
.turno{background:var(--panel);border:1px solid var(--borde);border-left:6px solid var(--hortensia);border-radius:12px;padding:10px 16px;margin:12px 0}
.turno .etq{color:var(--hortensia)}.turno .orden{font-size:.8rem;color:var(--suave);margin:0 0 6px}.turno .pre{margin:4px 0 2px;font-size:.92rem}
.turno .frase{font-size:1.12rem;font-style:italic;margin:.4em 0;color:var(--texto)}
.horas.corto li{padding:2px 0;border-bottom:0}.horas.corto b{color:var(--oro)}
.mas{margin:6px 0 4px}.mas summary{color:var(--hortensia);font-size:.95rem}.mas h3{margin:.7em 0 .2em}.mas p{margin:.2em 0}
.turno .regla-inventar{font-size:.82rem;margin:8px 0 0}
.pila h2{color:#6b4f1d;margin:.1em 0 .4em}.nav-pila{display:flex;gap:8px}.nav-pila button{margin:4px 0 10px}.nav-pila button:disabled{opacity:.35;cursor:default}
.leer-t{font-size:1.15rem;line-height:1.55;margin:.2em 0}.anf-turno .frase{font-weight:bold}
.tablero{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px}.tablero th{color:var(--oro);font-weight:normal;font-size:.72rem;padding:4px 2px;text-align:center;vertical-align:bottom}
.tablero td{padding:6px 2px;border-top:1px solid var(--borde);vertical-align:middle;text-align:center}.tablero td:first-child{text-align:left}.tablero small{display:block;color:var(--suave);font-size:.72rem;line-height:1.3}.tablero u{color:var(--texto)}
.tablero .celda{width:42px;min-height:42px;height:42px;margin:0 auto;padding:0;border-radius:8px;background:#0c1015;border:1px solid var(--borde);color:var(--oro);font-size:1.3rem}.tablero .celda.si{border-color:var(--oro);background:#2a2214}
.preguntas{margin:6px 0;font-size:.85rem}.preguntas dt{color:var(--oro);font-weight:bold;float:left;clear:left;margin-right:6px}.preguntas dd{margin:0 0 4px}
.ayuda{position:fixed;inset:0;z-index:9;background:rgba(8,10,14,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.ayuda-caja{background:var(--papel);color:var(--tinta);border-radius:10px;max-width:520px;width:100%;padding:16px 18px;max-height:100%;overflow:auto}.ayuda-caja .etq{color:#8a6420}
.pasos{padding-left:1.3em;margin:6px 0}.pasos li{margin:.5em 0;font-size:1.05rem}.pasos .dos{display:block;margin-top:4px;font-size:.98rem}.ayuda-caja .nota{color:#6d6250}
.kit{margin-top:14px;border-top:1px dashed #cdbd95;padding-top:4px}.kit .decir{padding-left:1.1em}.kit .decir li{margin:.35em 0;font-style:italic}.preg b{display:inline-block;margin-bottom:2px}
.telon{position:fixed;inset:0;background:#0b0e12;color:var(--suave);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;z-index:10}.telon p{margin:.2em}
.presentacion{font-style:italic}
.horas{list-style:none;padding:0;margin:0}.horas li{padding:6px 0;border-bottom:1px dashed #cdbd95}.horas b{display:inline-block;min-width:3.4em;color:#6b4f1d}
.papel{margin-top:14px;padding:10px 12px;border-radius:6px;background:#e9dfc4;border:1px solid #cdbd95}
.papel-t{font-weight:bold;font-size:1.1rem;margin:0 0 4px}
/* El recuadro del culpable es idéntico al de los inocentes: que no se distinga de un vistazo. */
.regla{border-left:4px solid var(--oro);padding-left:10px;font-weight:bold}
.decl{padding-left:1.1em}.decl li{margin:.4em 0}
.cierre{color:var(--hortensia);font-style:italic}
.leer{border-left:4px solid var(--hortensia)}
.codigo-grande{text-align:center}.digitos{font-size:3.4rem;letter-spacing:.25em;margin:.1em 0;color:var(--oro);font-family:'Courier New',monospace;font-weight:bold}
.tiempo{color:var(--suave);font-size:.95rem;margin:0}
.pestanas{display:flex;gap:6px;margin:4px 0 8px}.pestanas button{margin:0;min-height:44px;padding:8px;background:transparent;color:var(--suave);border:1px solid var(--borde);font-weight:normal}
.pestanas button.activa{background:var(--panel);color:var(--oro);border-color:var(--oro);font-weight:bold}
.qr-bloque{text-align:center}.qr{background:#fff;border-radius:10px;padding:6px;max-width:300px;margin:8px auto}.qr svg{display:block;width:100%;height:auto}
.token{font-family:'Courier New',monospace;font-size:2rem;letter-spacing:.12em;color:var(--oro);margin:.2em 0;font-weight:bold}
.enlace{font-size:.8rem;letter-spacing:0;text-transform:none}
.cuaderno{width:100%;border-collapse:collapse;font-size:.85rem}.cuaderno th{text-align:left;color:var(--oro);font-weight:normal;padding:4px}
.cuaderno td{padding:6px 4px;border-top:1px solid var(--borde);vertical-align:top}.cuaderno small{display:block;color:var(--suave);font-size:.75rem}
.cuaderno tr.tachado td{opacity:.35;text-decoration:line-through}
.voto .grande{font-size:1.4rem;color:var(--oro);margin:.2em 0}
.revelacion .fue{font-size:1.8rem;color:var(--oro)}.ironia{font-style:italic;border-left:4px solid var(--hortensia);padding-left:10px}
.resultado{font-size:1.3rem;font-weight:bold}.resultado[data-resultado=acierto]{color:var(--ok)}.resultado[data-resultado=fallo]{color:var(--mal)}
.aviso{border-color:var(--oro)}
.regla-pie p{margin:18px 0 0;text-align:center}
.regla-inventar{font-weight:bold;color:var(--oro)}.guia .regla-inventar{margin-top:6px}
</style>
</head>

  // «Otra partida» con el mismo grupo (escaneando en el mismo orden). Recuerda TODA la sesión.

  //  5. que nadie juegue un personaje que ya jugó en las dos partidas anteriores.
  // Ninguna preferencia mira quién es el culpable dentro de la mesa: entre nuevos y repetidos (y entre tardes),
  // el culpable sale en la misma proporción que hay de cada uno (tools/verificar-misterio-rapido.js lo mide).
  // Con contenido de una sola tarde por personaje equivale a la v2 (fase 2d).
  // Solo lo calcula el móvil del anfitrión, que guarda las semillas de la sesión; no muestra nada.
  // Caché de partidas solo para «Otra partida» (no sale de aquí: nadie modifica estas partidas)
  const CACHE_SS = typeof WeakMap !== 'undefined' ? new WeakMap() : null;

  function semillaSiguiente(C, historial, n) {

      const p = repartoDe(C, s, n);
      if (prohibeA.indexOf(p.asientos.indexOf(p.culpable)) >= 0) continue;
      if (reserva === null) reserva = s;
      if (p.variante === ultimo.variante) continue;
      if (notaDe(p).nota >= mejorNota) continue;

  // ---------- Textos ----------

  function textoDeclaracion(C, d) {

  }

  return { generar, svg, rsDivisor, rsResto, bitsFormato, bitsVersion, capacidad, modulosDatos, palabrasCodigo, ECC };
});

// Interfaz de la mini web del formato rápido (solo navegador). La copia tools/construir-misterio-rapido.js

// Cada jugador entra con su enlace (#j=CÓDIGO) o escribiendo el código; el progreso se guarda en el propio

  function cabecera() {

  function pantallaCrear() {

      '<li>' + esc(U('como1')) + '</li>' +

  // ---------- Textos que enseña cada pantalla ----------

    if (pub.instruccion) h += '<p>' + esc(pub.instruccion) + '</p>';

    if (pub.regla) t.push(pub.regla);
    if (pub.instruccion) t.push(pub.instruccion);

  // Tarjeta 1 de la pestaña Ahora: lo privado de la ronda (M.pantalla), con su etiqueta «Guárdalo» o «Cuéntalo»

      // El papel va en una sola línea, con el título en negrita delante («Eres inocente. No puedes mentir…»)

        (x.etq ? '<p class="sello sello-' + x.etq + '" data-etq="' + x.etq + '">' + esc(U({ guarda: 'etqGuarda', cuenta: 'etqCuenta', usa: 'etqUsa' }[x.etq])) + '</p>' : '') + '</div>';

  // Tarjeta 2: tu turno. Una frase a la vista; la otra frase, la pregunta y la jugada, en «Más ayuda»
  function htmlTarjetaTurno(pz) {

  function vistaPersonaje(cont, partida, asiento, st, guardar, esAnfitrion) {

  // Pestaña «Ahora»: selector de rondas, banda «Ahora toca» y como mucho 2 tarjetas

    if (st.verDe !== r + (st.enVoto ? 'v' : '')) { st.ver = null; st.verDe = r + (st.enVoto ? 'v' : ''); }
    const actual = r >= 5 ? 'fin' : r === 3 && st.enVoto ? 'voto' : r;
    const abiertas = [1, 2, 3].filter(k => k <= Math.min(r, 3)).concat(r >= 3 ? ['voto'] : []).concat(r >= 5 ? ['fin'] : []);
    let ver = st.ver || actual;
    if (abiertas.indexOf(ver) < 0) ver = actual;
    const sel = el('<div class="selector"><span>' + esc(U('selRonda')) + '</span></div>');
    for (const k of [1, 2, 3, 'voto'].concat(r >= 5 ? ['fin'] : [])) {

      sel.append(boton(t, () => { st.ver = k; guardar(); pintar(true); }, 'pill' + (k === ver ? ' activa' : ''), ' data-ver="' + k + '"' + (abiertas.indexOf(k) >= 0 ? '' : ' disabled')));

  // Pestaña «Mi personaje»: 4 tarjetas, una a una (Quién eres → Tu secreto → Dónde dices que estabas → Tu papel)

  function vistaPila(cont, tj, st, guardar) {
    const pilas = [

    const c = seccion('carta pila', '<p class="etq">' + esc(U('deN', { k: k + 1, n: pilas.length })) + '</p><h2>' + esc(pilas[k][0]) + '</h2>' + pilas[k][1], ' data-pila="' + k + '"');
    const nav = el('<div class="nav-pila"></div>');
    nav.append(boton(U('atras'), () => { st.pj = k - 1; guardar(); pintar(true); }, 'sec', ' data-accion="pila-atras"' + (k === 0 ? ' disabled' : '')));
    nav.append(boton(U('siguiente'), () => { st.pj = k + 1; guardar(); pintar(true); }, '', ' data-accion="pila-siguiente"' + (k === pilas.length - 1 ? ' disabled' : '')));
    cont.append(c);
    cont.append(nav);
  }

  // Pestaña «Cuaderno»: tablero de sospechosos (v2.1, más simple). Dos columnas de marca que se abren con las
  // rondas («Sin testigo» desde la 2, «Encaja con la prueba» en la 3); tocar el nombre tacha la fila («fuera de
  // sospecha»). No cuenta ni resuelve nada por el jugador.
  function vistaCuaderno(cont, partida, yo, st, guardar) {
    const r = st.ronda;
    st.marcas = st.marcas || {};
    st.tachados = st.tachados || [];
    const cols = [];
    if (r >= 2) cols.push({ k: 't', t: U('colTestigo'), q: U('preguntaTestigo', { h: partida.hora }) });
    if (r >= 3) cols.push({ k: 'p', t: U('colPrueba'), q: U('preguntaPrueba', { prueba: C.senas[partida.prueba].prueba }) });
    let h = '<h2>' + esc(U('cuaderno')) + '</h2>';
    if (cols.length) h += '<p class="nota" data-uso="1">' + esc(U('cuadernoUso')) + '</p><dl class="preguntas">' + cols.map(c => '<dt>' + esc(c.t) + '</dt><dd>' + esc(c.q) + '</dd>').join('') + '</dl>';
    else h += '<p class="nota">' + esc(U('cuadernoEspera')) + '</p>';
    h += '<table class="tablero"><thead><tr><th></th>' + cols.map(c => '<th>' + esc(c.t) + '</th>').join('') + '</tr></thead><tbody>';
    const fila = M.cuaderno(C, partida);
    for (const f of fila) {
      const m = st.marcas[f.id] || {};
      const tachada = st.tachados.indexOf(f.id) >= 0;
      h += '<tr data-id="' + esc(f.id) + '" data-tarde="' + esc(f.tarde) + '" class="' + (tachada ? 'tachada' : '') + '"><td><button type="button" class="nombre-fila" data-tachar="' + esc(f.id) + '" aria-pressed="' + tachada + '" aria-label="' + esc(f.apellido + ': ' + U('fueraSospecha')) + '">' + esc(f.apellido) + (f.id === yo ? ' ' + U('tuMarca') : '') + (tachada ? '<span class="fuera">' + esc(U('fueraSospecha')) + '</span>' : '') + '</button><small>' + esc(f.rol) + '</small><small>' +
        C.momentos.map((hh, i) => (hh === partida.hora && r >= 2 ? '<u>' + esc(hh + ' ' + f.horas[i]) + '</u>' : esc(hh + ' ' + f.horas[i]))).join(' · ') + '</small><small>' + esc(f.senas.join(' · ')) + '</small></td>' +
        cols.map(c => '<td><button type="button" class="celda' + (m[c.k] ? ' si' : '') + '" data-celda="' + c.k + '" aria-pressed="' + (m[c.k] ? 'true' : 'false') + '" aria-label="' + esc(f.apellido + ': ' + c.t) + '">' + (m[c.k] ? '✓' : '') + '</button></td>').join('') + '</tr>';
    }
    h += '</tbody></table>';
    const s = seccion('panel cuaderno-v2', h, ' data-cuaderno="1"');
    s.querySelectorAll('tr[data-id]').forEach(tr => {
      const id = tr.dataset.id;
      tr.querySelectorAll('[data-celda]').forEach(b => b.addEventListener('click', () => {
        const m = st.marcas[id] || (st.marcas[id] = {});
        m[b.dataset.celda] = !m[b.dataset.celda]; guardar(); pintar(false);
      }));
      tr.querySelector('[data-tachar]').addEventListener('click', () => {
        const i = st.tachados.indexOf(id);
        if (i >= 0) st.tachados.splice(i, 1); else st.tachados.push(id);
        guardar(); pintar(false);
      });
    });
    cont.append(s);
    // Lo que ha leído quien organiza, ronda a ronda, plegado (para repasar, no para leer durante la ronda)
    let dicho = '';
    for (let k = 1; k <= Math.min(r, 3); k++) dicho += '<h3>' + esc(U('rondaDe', { r: k })) + '</h3>' + htmlPublico(M.publico(C, partida, k));
    cont.append(plegable(U('loDicho'), dicho, false, 'panel publico', ' data-dicho="1"'));
  }

  function votoUI(partida, yo, st, guardar) {
    const s = seccion('panel voto', '<p class="etq">' + esc(U('tuVoto')) + '</p>');
    if (st.voto) {
      s.append(el('<p class="grande" data-voto="' + esc(st.voto) + '">' + esc(U('acusas', { s: AP(st.voto) })) + '</p>'));
      s.append(el('<p class="nota">' + esc(U('ensena')) + '</p>'));
      s.append(el('<p class="nota" data-empate="1">' + esc(U('reglaEmpate')) + '</p>'));
      // Tras la revelación (ronda 5) ya no se puede cambiar el voto
      if (st.ronda < 5) s.append(boton(U('cambiarVoto'), () => { if (st.ronda >= 5) return; st.voto = null; guardar(); pintar(); }, 'sec', ' data-accion="cambiar-voto"'));
      return s;
    }
    s.append(el('<p>' + esc(U('eligeAcusar')) + '</p>'));
    s.append(el('<p class="nota" data-empate="1">' + esc(U('reglaEmpate')) + '</p>'));
    for (const id of partida.asientos.slice().sort((a, b) => C.personajes.find(p => p.id === a).n - C.personajes.find(p => p.id === b).n)) {
      if (id === yo) continue;
      s.append(boton(U('acuso', { s: AP(id) }), () => { st.voto = id; guardar(); pintar(); }, 'sec voto-op', ' data-acusar="' + esc(id) + '"'));
    }
    return s;
  }

  function formCodigo(partida, objetivo, st, guardar) {
    const etiqueta = objetivo === 4 ? U('etqCodigoSolucion') : U('etqCodigoRonda', { r: objetivo });
    const f = seccion('panel codigo', '<label>' + esc(etiqueta) + '</label><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="···" data-objetivo="' + objetivo + '"><div class="error" role="alert"></div>');
    const inp = f.querySelector('input'), err = f.querySelector('.error');
    const probar = () => {
      const ahora = Date.now();
      if (st.bloqueo && ahora < st.bloqueo) { err.textContent = U('demasiados'); return; }
      if (inp.value.trim() === partida.codigos[objetivo]) { st.ronda = objetivo === 4 ? 5 : objetivo; st.fallos = 0; st.ver = null; st.vista = 'ahora'; guardar(); pintar(true); return; }
      st.fallos = (st.fallos || 0) + 1;
      if (st.fallos >= 5) { st.bloqueo = ahora + 15000; st.fallos = 0; }
      guardar();
      err.textContent = U('noEsCodigo');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') probar(); });
    // Casilla y botón en la misma fila (ocupa la mitad de alto)
    const fila = el('<div class="fila-codigo"></div>');
    fila.append(inp, boton(objetivo === 4 ? U('verSolucion') : U('abrirRonda', { r: objetivo }), probar, '', ' data-accion="codigo"'));
    f.insertBefore(fila, err);
    return f;
  }

  // ---------- Jugador ----------
  function pantallaJugador(id) {
    const { semilla, n, asiento } = id.datos;
    const partida = partidaDe(semilla, n);
    const clave = 'j:' + id.token;
    const st = leer(clave) || { ronda: 1, tachados: [] };
    const guardar = () => escribir(clave, st);
    if (!st.g) return elegirVersion(app, partida, asiento, g => { st.g = g; guardar(); pintar(true); });
    vistaPersonaje(app, partida, asiento, st, guardar, false);
  }

  // ---------- Anfitrión ----------
  const RONDA_DE_PASO = { listo: 1, r1: 1, r2: 2, r3: 3, voto: 3, final: 5 };
  function pantallaAnfitrion() {
    const st = leer('anfitrion');
    const partida = partidaDe(st.semilla, st.n);
    const guardar = () => escribir('anfitrion', st);
    if (st.paso === 'reparto') return pantallaReparto(st, partida, guardar);
    const nav = el('<nav class="pestanas"><button type="button" data-v="partida">' + esc(U('pestPartida')) + '</button><button type="button" data-v="personaje">' + esc(U('pestPersonaje')) + '</button></nav>');
    nav.querySelectorAll('button').forEach(b => {
      if (b.dataset.v === (st.vista || 'partida')) b.classList.add('activa');
      b.addEventListener('click', () => { st.vista = b.dataset.v; guardar(); pintar(true); });
    });
    app.append(nav);
    if (st.vista === 'personaje') {
      const yo = st.yo || (st.yo = { tachados: [] });
      yo.ronda = RONDA_DE_PASO[st.paso];
      yo.enVoto = st.paso === 'voto';
      const g2 = () => { guardar(); };
      if (!yo.g) return elegirVersion(app, partida, 1, g => { yo.g = g; guardar(); pintar(true); });
      return vistaPersonaje(app, partida, 1, yo, g2, true);
    }
    panelPartida(st, partida, guardar);
  }

  function urlJugador(partida, asiento) { return location.href.split('#')[0] + '#j=' + M.codificarToken(partida.semilla, partida.n, asiento); }
  function bloqueQR(partida, asiento) {
    const token = M.codificarToken(partida.semilla, partida.n, asiento);
    const url = urlJugador(partida, asiento);
    const q = Q.generar(url);
    window.__ultimoQR = { texto: url, modulos: q.modulos };
    const b = el('<div class="qr-bloque"><div class="qr" data-qr-version="' + q.version + '">' + Q.svg(url, 4) + '</div><p class="nota">' + esc(U('qrNota')) + '</p><p class="token" data-token="' + esc(token) + '">' + esc(token) + '</p></div>');
    b.append(boton(U('copiar'), async e => {
      try { await navigator.clipboard.writeText(url); e.target.textContent = U('copiado'); }
      catch (x) { const i = el('<input type="text" readonly class="enlace">'); i.value = url; b.append(i); i.select(); }
    }, 'sec pequeno'));
    return b;
  }

  function pantallaReparto(st, partida, guardar) {
    const k = st.siguiente;
    app.append(el('<p class="etq">' + esc(U('repartir')) + '</p>'));
    app.append(el('<h1 class="titulo">' + esc(U('jugadorDe', { k, n: st.n })) + '</h1>'));
    app.append(el('<p>' + esc(U('escanea')).replace('{mesa}', '<b>' + esc(U('mesa', { mesa: M.nombreMesa(partida.semilla) })) + '</b>') + '</p>'));
    app.append(bloqueQR(partida, k));
    app.append(boton(k < st.n ? U('siguienteJugador') : U('estamosTodos'), () => {
      if (k < st.n) st.siguiente = k + 1; else { st.paso = 'listo'; st.vista = 'personaje'; }
      guardar(); pintar(true);
    }, '', ' data-accion="siguiente"'));
    if (k > 2) app.append(boton(U('anterior'), () => { st.siguiente = k - 1; guardar(); pintar(true); }, 'sec'));
    if (st.otraVez) app.append(el('<p class="nota"><b>' + esc(U('otraVezTitulo', { k: (st.historial || []).length + 1 })) + '</b> ' + esc(U('otraVezNota')) + '</p>'));
    app.append(el('<p class="nota">' + esc(U('eresJugador1')) + '</p>'));
  }

  function temporizador(desde, minutos) {
    const t = el('<p class="tiempo" aria-live="off"></p>');
    const act = () => { const s = Math.max(0, Math.floor((Date.now() - desde) / 1000)); t.textContent = U('llevamos', { t: Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') }) + (minutos ? U('unosMinutos', { m: minutos }) : ''); };
    act(); reloj = setInterval(act, 1000);
    return t;
  }

  // Panel del anfitrión: banda «Ahora toca», código de la ronda y lo que se lee en voz alta, en tarjetas cortas
  // (una a una, con Siguiente / Atrás). Tras la lectura, la tarjeta del turno de la mesa («empiezas tú y sigue
  // por tu izquierda»: el móvil no sabe quién es cada persona, la regla es física) y, en las rondas 2 y 3, la de
  // preguntas (2-3 minutos). v2.1: la ronda 1 empieza con «leed vuestro personaje en silencio» y el botón de
  // pasar de ronda solo sale en la última tarjeta.
  function panelPartida(st, partida, guardar) {
    const avanzar = paso => { st.paso = paso; st.inicio = Date.now(); st.lectura = 0; guardar(); pintar(true); };
    const p = st.paso;
    if (p === 'listo') {
      app.append(el('<h1 class="titulo">' + esc(U('todosDentro')) + '</h1>'));
      app.append(banda(U('anfListo'), ' data-banda="listo"'));
      app.append(el('<p>' + esc(U('miraPersonaje')) + '</p>'));
      app.append(boton(U('empezarR1'), () => avanzar('r1'), '', ' data-accion="r1"'));
      app.append(otraVezQR(partida));
      return;
    }
    const ronda = { r1: 1, r2: 2, r3: 3 }[p];
    if (ronda) {
      const pub = M.publico(C, partida, ronda);
      const sig = { 1: [U('pasarR2'), 'r2'], 2: [U('pasarR3'), 'r3'], 3: [U('pasarVoto'), 'voto'] }[ronda];
      const horas = M.lista(C.momentos, C);
      // En las rondas 2 y 3, después del turno vienen las preguntas: el turno acaba con «Siguiente»
      const turno = [U('turnoMesa'), { 1: U('turnoQueR1', { horas }), 2: U('turnoQueR2', { h: partida.hora }), 3: U('turnoQueR3', { h: partida.hora }) }[ronda], U('turnoAcabar', { boton: ronda === 1 ? sig[0] : U('siguiente') })];
      const leer = (ronda === 1 ? [U('anfR1Silencio')] : []).concat(trozosPublico(pub));
      const tarjetas = leer.map(t => ({ tipo: 'leer', t })).concat([{ tipo: 'turno', t: turno }]).concat(ronda >= 2 ? [{ tipo: 'preguntas', t: [U('preguntasMesa'), U('turnoAcabar', { boton: sig[0] })] }] : []);
      const k = Math.max(0, Math.min(tarjetas.length - 1, st.lectura || 0));
      const tj = tarjetas[k];
      app.append(el('<div class="fila-cab"><span class="chip">' + esc(U('rondaDe', { r: ronda })) + '</span></div>'));
      app.append(el('<h1 class="titulo">' + esc(pub.titulo.split('·')[1] || pub.titulo) + '</h1>'));
      app.append(temporizador(st.inicio, DURACION[ronda]));
      app.append(el('<p class="aviso-juegas" data-aviso-juegas="1">' + esc(U('avisoJuegas')) + '</p>'));
      app.append(banda(tj.tipo === 'turno' ? U('anfTurno') : tj.tipo === 'preguntas' ? U('anfPreguntas') : k === 0 && ronda >= 2 ? U('anfCodigo') : U('anfLeer'), ' data-banda="' + (tj.tipo === 'leer' ? 'leer' : tj.tipo) + '"'));
      if (ronda >= 2) app.append(seccion('panel codigo-grande', '<p>' + esc(U('diCodigo')) + '</p><p class="digitos" data-codigo="' + partida.codigos[ronda] + '">' + partida.codigos[ronda] + '</p><p class="nota">' + esc(U('cadaUnoEscribe')) + '</p>'));
      const c = tj.tipo === 'turno'
        ? seccion('turno anf-turno', '<p class="etq et-turno">' + esc(U('turnoMesaTitulo')) + '</p><p class="frase">' + esc(tj.t[0]) + '</p><p>' + esc(tj.t[1]) + '</p><p class="nota">' + esc(tj.t[2]) + '</p>', ' data-lectura="turno"')
        : tj.tipo === 'preguntas'
        ? seccion('turno anf-turno', '<p class="etq et-turno">' + esc(U('preguntasTitulo')) + '</p><p class="frase">' + esc(tj.t[0]) + '</p><p class="nota">' + esc(tj.t[1]) + '</p>', ' data-lectura="preguntas"')
        : seccion('panel leer', '<p class="etq">' + esc(U('leeVozAlta')) + ' · ' + esc(U('deN', { k: k + 1, n: tarjetas.length })) + '</p><p class="leer-t">' + esc(tj.t) + '</p>', ' data-lectura="' + k + '"');
      app.append(c);
      const nav = el('<div class="nav-pila"></div>');
      nav.append(boton(U('atras'), () => { st.lectura = k - 1; guardar(); pintar(false); }, 'sec', ' data-accion="leer-atras"' + (k === 0 ? ' disabled' : '')));
      nav.append(boton(U('siguiente'), () => { st.lectura = k + 1; guardar(); pintar(false); }, k < tarjetas.length - 1 ? '' : 'sec', ' data-accion="leer-siguiente"' + (k === tarjetas.length - 1 ? ' disabled' : '')));
      app.append(nav);
      // Pasar de ronda, solo en la última tarjeta (para no pulsarlo sin querer a mitad de la lectura)
      if (k === tarjetas.length - 1) app.append(boton(sig[0], () => avanzar(sig[1]), '', ' data-accion="' + sig[1] + '"'));
      app.append(plegable(U('todoJunto'), htmlPublico(pub), false, 'panel', ' data-todo="1"'));
      app.append(otraVezQR(partida));
      return;
    }
    if (p === 'voto') {
      app.append(el('<p class="chip">' + esc(U('votacion')) + '</p>'));
      app.append(el('<h1 class="titulo">' + esc(U('quienFue')) + '</h1>'));
      app.append(banda(U('anfVoto'), ' data-banda="voto"'));
      app.append(seccion('panel leer', '<p class="etq">' + esc(U('leeVozAlta')) + '</p><p class="leer-t">' + esc(C.textos.voto) + '</p><p class="leer-t" data-empate="1"><b>' + esc(U('reglaEmpate')) + '</b></p>'));
      app.append(el('<p>' + esc(U('tuTambienVotas')) + '</p>'));
      app.append(el('<p class="aviso-juegas" data-espera-votos="1">' + esc(U('esperaVotos')) + '</p>'));
      app.append(boton(U('revelar'), () => { if (confirm(U('confirmarRevelar'))) avanzar('final'); }, '', ' data-accion="revelar"'));
      return;
    }
    if (p === 'final') {
      app.append(banda(U('anfFinal'), ' data-banda="final"'));
      app.append(seccion('panel codigo-grande', '<p>' + esc(U('diCodigoSolucion')) + '</p><p class="digitos" data-codigo="' + partida.codigos[4] + '">' + partida.codigos[4] + '</p>'));
      // v2.1: en grande, «Fue X» y lo esencial; el resto, plegado (cada uno lo tiene en su móvil)
      const rv = M.revelacion(C, partida);
      const ult = rv.parrafos.length - 1;
      const resto = parrafos(rv.parrafos.slice(1, ult)) + '<p class="ironia">' + esc(rv.ironia) + '</p>' +
        '<h3>' + esc(U('hComoSaber')) + '</h3><ol>' + rv.como.map(x => '<li>' + esc(x) + '</li>').join('') + '</ol>' +
        '<h3>' + esc(U('hSecretosMesa')) + '</h3><ul>' + rv.secretos.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      const sr = seccion('panel revelacion revelacion-corta', '<p class="etq">' + esc(U('leeVozAlta')) + '</p><h2 class="fue">' + esc(rv.titulo) + '</h2>' +
        '<p class="esencial">' + esc(rv.parrafos[0]) + '</p>' + (ult > 0 ? '<p class="esencial">' + esc(rv.parrafos[ult]) + '</p>' : ''), ' data-revelacion="anfitrion"');
      sr.append(plegable(U('restoSolucion'), resto, false, 'mas', ' data-resto="1"'));
      app.append(sr);
      app.append(boton(U('otraPartida'), () => {
        const historial = (st.historial || []).concat([st.semilla]);
        escribir('anfitrion', { semilla: M.semillaSiguiente(C, historial, st.n), n: st.n, paso: 'reparto', siguiente: 2, inicio: Date.now(), vista: 'partida', yo: { tachados: [] }, otraVez: true, historial });
        pintar(true);
      }, '', ' data-accion="otra"'));
      app.append(boton(U('salir'), () => { location.hash = ''; }, 'sec'));
    }
  }

  function otraVezQR(partida) {
    const d = el('<details class="panel"><summary>' + esc(U('perdido')) + '</summary><div class="cuerpo"><p class="nota">' + esc(U('perdidoNota')) + '</p><div class="numeros"></div><div class="hueco"></div></div></details>');
    const fila = d.querySelector('.numeros'), hueco = d.querySelector('.hueco');
    for (let k = 2; k <= partida.n; k++) fila.append(boton(String(k), () => { hueco.innerHTML = ''; hueco.append(bloqueQR(partida, k)); }, 'num sec'));
    return d;
  }

  pintar(false);
})();

</script>
</body>
